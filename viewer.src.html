<title>ASC 베이 플랜 뷰어</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: CASP 방식 — General Plan(전 베이, 선수가 오른쪽)이 메인. 베이를 더블클릭하면 Bay Plan 창이 위에 뜸. 한 가지 모습으로 고정(밝은 회색 바탕). */
:root{
  color-scheme:light;
  --desk:#bdbdbd; --win:#ffffff; --chrome:#d4d0c8; --edge:#000000; --shade:#808080;
  --fg:#000000; --fg2:#3a3a3a; --num:#0000c8; --title:#000080; --title-fg:#ffffff; --warn:#d00000;
  --p0:#ffff00; --k0:#000; --p1:#0000ff; --k1:#fff; --p2:#ff0000; --k2:#fff; --p3:#00ffff; --k3:#000;
  --p4:#00e000; --k4:#000; --p5:#ff00ff; --k5:#000; --p6:#8000c0; --k6:#fff; --p7:#ff8000; --k7:#000;
  --p8:#008080; --k8:#fff; --p9:#808000; --k9:#fff;
  --sans:Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--fg);font-family:var(--sans);font-size:13px;line-height:1.4;
  padding-block:10px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:none;margin:0;display:flex;flex-direction:column;gap:10px}
#plan{width:100%;margin:0}
.win{background:var(--win);border:1px solid var(--edge);box-shadow:2px 2px 0 var(--shade);min-width:0}
.tb{background:var(--title);color:var(--title-fg);font-weight:700;font-size:13px;padding:3px 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tb small{font-weight:400;opacity:.9;font-variant-numeric:tabular-nums}
.body{padding:8px 10px}
header.win .body{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;background:var(--chrome)}
#logo{width:56px;height:56px;object-fit:contain;background:var(--win);border:1px solid var(--edge);flex:none}
.file{font-family:Consolas,monospace;font-size:12px;min-width:0;overflow-wrap:anywhere;flex:1 1 200px}
.btn,.seg button,#ship,#q,.x{font:inherit;font-size:12.5px;background:var(--chrome);color:var(--fg);border:1px solid var(--edge);
  box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 var(--shade);padding:5px 12px;cursor:pointer;border-radius:0}
.btn{font-weight:700}
.btn:focus-visible,.chipb:focus-visible,.swc:focus-visible,.c:focus-visible,.mini:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--num);outline-offset:1px}
.note{background:#ffffe1;border:1px solid var(--edge);padding:6px 10px;font-size:12.5px}
.err{color:var(--warn)}
.kv{display:flex;flex-wrap:wrap;gap:4px 20px;font-variant-numeric:tabular-nums}
.kv div{display:flex;gap:5px;align-items:baseline}
.kv span{color:var(--fg2);font-size:11.5px}
.kv b{font-size:15px}
.kv small{font-size:11.5px;font-weight:400}
.rot{font-family:Consolas,monospace;font-size:11.5px;color:var(--fg2);overflow-wrap:anywhere;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{display:inline-flex;align-items:stretch;border:1px solid var(--edge);background:var(--win)}
.chip.on{box-shadow:0 0 0 2px var(--num)}
.swc{appearance:none;-webkit-appearance:none;width:26px;min-height:24px;height:auto;padding:0;border:0;border-right:1px solid var(--edge);background:none;cursor:pointer;border-radius:0}
.swc::-webkit-color-swatch-wrapper{padding:0}
.swc::-webkit-color-swatch{border:0;border-radius:0}
.swc::-moz-color-swatch{border:0;border-radius:0}
.chipb{font:inherit;display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--fg);padding:2px 8px;cursor:pointer;font-variant-numeric:tabular-nums;font-size:12px}
.chipb small{color:var(--fg2);font-size:11px}
.chips .x{padding:2px 8px;font-size:11.5px;margin-left:6px}
.chips #sortCol{margin:0 4px 0 0;font-weight:700;background:linear-gradient(90deg,#ff4136 0 25%,#19c2b0 25% 50%,#ff85e0 50% 75%,#ff9f1a 75%) bottom/100% 4px no-repeat,var(--chrome);padding-bottom:5px}
.hint{font-size:11.5px;color:var(--fg2);margin-top:6px}
.tools{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.tools label{font-size:12px}
.seg{display:inline-flex}
.seg button{margin-right:-1px}
.seg button[aria-pressed="true"]{box-shadow:inset 1px 1px 0 var(--shade),inset -1px -1px 0 #fff;background:var(--win);font-weight:700}
#ship,#q{background:var(--win);box-shadow:inset 1px 1px 0 var(--shade);cursor:auto;padding:5px 7px;max-width:100%}
#q{width:150px;font-family:Consolas,monospace;text-transform:uppercase}
#qn{font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:11.5px;align-items:center}
.legend span{display:inline-flex;gap:5px;align-items:center}
.lg{width:15px;height:15px;border:1px solid var(--edge);display:inline-flex;align-items:center;justify-content:center;font-size:9px;background:var(--win);line-height:1}
.lg.f40{background:repeating-linear-gradient(135deg,rgba(0,0,0,.5) 0 1px,transparent 1px 4px),var(--p0)}
.lg.out{outline:2px dashed var(--warn);outline-offset:-2px;background:var(--p3)}

/* General Plan */
.gpw{overflow:auto;max-height:max(300px,calc(100vh - 130px));overscroll-behavior:contain}
@media (hover:none) and (orientation:landscape) and (max-height:519px){.gpw{max-height:max(200px,calc(100vh - 58px));max-height:max(200px,calc(100dvh - 58px))}}   /* 가로로 눕힌 폰: 화면 높이를 거의 다 씀 */
.gp{display:flex;flex-wrap:nowrap;width:max-content;margin-left:auto;gap:10px 4px;padding:8px 6px;align-items:flex-start}
.gp.wrap{flex-direction:row-reverse;flex-wrap:wrap;width:auto;margin-left:0;justify-content:flex-start;gap:18px 4px}
.gp.wrap .gh{border-left:0;border-right:1px solid #d0d0d0}
.zoom{display:inline-flex;gap:3px;align-items:center}
#gpWin{position:relative;align-self:flex-start;width:100%;max-width:100%}
.rz{position:absolute;z-index:3;touch-action:none}
.rzr{top:0;right:-5px;width:10px;height:100%;cursor:ew-resize}
.rzb{left:0;bottom:-5px;height:10px;width:100%;cursor:ns-resize}
.rzc{right:-3px;bottom:-3px;width:18px;height:18px;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 0 50%,var(--shade) 50% 58%,transparent 58% 68%,var(--shade) 68% 76%,transparent 76% 86%,var(--shade) 86% 94%,transparent 94%)}
body.rzing{user-select:none;-webkit-user-select:none}
.tb button,.tb select{font:inherit;font-weight:700;font-size:12px;background:var(--chrome);color:var(--fg);border:1px solid var(--edge);
  box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 var(--shade);min-width:26px;height:22px;padding:0 6px;cursor:pointer;border-radius:0}
.tb .sp{flex:1}
.gh{display:flex;flex-direction:column;gap:6px;align-items:center;padding:0 5px;border-left:1px solid #d0d0d0}
.mini{font:inherit;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--fg)}
.mini span{font-size:9.5px;font-family:Consolas,monospace;letter-spacing:.02em}
.mg{display:grid;grid-template-columns:repeat(var(--n),var(--ms,15px)) calc(var(--ms,15px) + 5px);padding:0 0 1px 0}
.m{height:var(--ms,15px);border:1px solid var(--edge);margin:0 -1px -1px 0;background:var(--win);font-size:calc(var(--ms,15px) - 3px);line-height:calc(var(--ms,15px) - 3px);text-align:center;overflow:hidden}
.m{position:relative}
.m i{position:absolute;font-style:normal;font-weight:700;font-family:Arial,sans-serif;font-size:calc(var(--ms,15px) * .44);line-height:1;letter-spacing:-.04em}
.m .mh{top:0;left:1px;color:var(--ck)}
.m .md{top:0;right:0;background:#fff;color:var(--warn);padding:0 1px}
.m .me{bottom:0;left:1px;color:var(--ck2)}
.m .mrr{bottom:0;right:1px;color:var(--ck2)}
.m.n{visibility:hidden}
.m.b{background:var(--c)}
.m.f40{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ck,#000) 62%,transparent) 0 1px,transparent 1px 3px),var(--c)}
.m.dim{opacity:.18}
.mbar{grid-column:1/-1;height:2px;background:var(--edge);margin:3px calc(var(--ms,15px) + 5px) 2px 0}
.mr,.mt{font-family:Arial,sans-serif;font-size:calc(var(--ms,15px) * .56);color:var(--num);line-height:1;display:flex;align-items:center;justify-content:center;letter-spacing:-.03em}
.mr{height:calc(var(--ms,15px) * .8)}
.mt{padding-left:3px}

.m.hit{outline:2px solid var(--num);outline-offset:0;position:relative;z-index:1}
.mini.cur span{background:var(--title);color:var(--title-fg);padding:0 4px}
.mini:hover span{text-decoration:underline}
.mini span{font-size:max(9px,calc(var(--ms,15px) * .73))}
/* Bay Plan 창 */
#bw{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:15;display:flex;align-items:center;justify-content:center;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(74px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.bwin{width:var(--bw,600px);max-width:100%;max-height:100%;display:flex;flex-direction:column;box-shadow:4px 4px 0 rgba(0,0,0,.5)}
.bwin .tb{align-items:center;flex-wrap:nowrap}
.bwin .tb .sp{flex:1}
.bwin .tb #bwT,.bwin .tb #bwS,.bwin .tb button{white-space:nowrap;flex:none}
.bwin .tb{overflow:hidden}
.bwin .tb button{font:inherit;font-weight:700;font-size:12px;background:var(--chrome);color:var(--fg);border:1px solid var(--edge);
  box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 var(--shade);min-width:26px;height:22px;padding:0 6px;cursor:pointer;border-radius:0}
.bwb{overflow:auto;padding:10px 12px 12px;flex:1 1 auto;min-height:0}
/* Bay Plan 창 옮기기·크기 조절 (윈도우 창처럼) */
.bwin{position:relative}
.bwin .tb{cursor:move;user-select:none;-webkit-user-select:none;touch-action:none}
.bwin .tb button{cursor:pointer}
#bw.free{display:block}
#bw.free .bwin{position:absolute;max-width:none;max-height:none}
.wr{position:absolute;z-index:6;touch-action:none}
.wr.n{top:-4px;left:8px;right:8px;height:8px;cursor:ns-resize}
.wr.s{bottom:-4px;left:8px;right:8px;height:8px;cursor:ns-resize}
.wr.e{right:-4px;top:8px;bottom:8px;width:8px;cursor:ew-resize}
.wr.w{left:-4px;top:8px;bottom:8px;width:8px;cursor:ew-resize}
.wr.nw{left:-5px;top:-5px;width:13px;height:13px;cursor:nwse-resize}
.wr.ne{right:-5px;top:-5px;width:13px;height:13px;cursor:nesw-resize}
.wr.sw{left:-5px;bottom:-5px;width:13px;height:13px;cursor:nesw-resize}
.wr.se{right:-5px;bottom:-5px;width:16px;height:16px;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 0 50%,var(--shade) 50% 58%,transparent 58% 68%,var(--shade) 68% 76%,transparent 76% 86%,var(--shade) 86% 94%,transparent 94%)}
.bwb .bay{max-width:none}
/* Bay Plan */
.bays{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:flex-start;padding:8px 10px 10px}
.bay{flex:1 1 280px;min-width:0;max-width:var(--w)}
.bt{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin:0 22px 4px 0;font-variant-numeric:tabular-nums}
.bt b{font-size:13px}
.g{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr)) 22px;gap:1px;font-variant-numeric:tabular-nums}
.rl,.tl{font-size:11px;color:var(--num);display:flex;align-items:center;justify-content:center;min-width:0;height:16px}
.tl{height:auto}
.sw{font-size:9.5px;color:var(--fg2);display:flex;align-items:center;justify-content:center;height:13px;min-width:0}
.sw.z{color:transparent}
.hbar{grid-column:1/-1;height:6px;background:var(--edge);margin:4px 23px 4px 0}
.c{font:inherit;height:var(--ch,34px);min-width:0;padding:0;border:1px solid var(--edge);border-radius:0;background:var(--win);position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;overflow:hidden;color:var(--fg)}
.c.no{visibility:hidden}
.c.xx{font-size:11px;color:var(--fg)}
.c.b{background:var(--c);color:var(--ck);cursor:pointer}
.c.b.f40{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ck,#000) 38%,transparent) 0 1px,transparent 1px 6px),var(--c)}
.c.b.pp{background:linear-gradient(to bottom,var(--c) 0 60%,var(--c2) 60% 100%)}
.c.b.pp .p,.c.b.pp .r,.c.b.pp .e{color:var(--ck2);opacity:1}
.c.b.pp .w{position:absolute;inset:0 0 40% 0;display:flex;align-items:center;justify-content:center}
.c.b.pp .p{position:absolute;inset:60% 0 0 0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:9.5px;letter-spacing:.02em}
.c.b.pp.f40{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ck,#000) 38%,transparent) 0 1px,transparent 1px 6px) top/100% 60% no-repeat,linear-gradient(to bottom,var(--c) 0 60%,var(--c2) 60% 100%)}
.m.b.pp{background:linear-gradient(to bottom,var(--c) 0 50%,var(--c2) 50% 100%)}
.m.b.pp.f40{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ck,#000) 62%,transparent) 0 1px,transparent 1px 3px) top/100% 50% no-repeat,
  repeating-linear-gradient(135deg,color-mix(in srgb,var(--ck2,#000) 62%,transparent) 0 1px,transparent 1px 3px) bottom/100% 50% no-repeat,
  linear-gradient(to bottom,var(--c) 0 50%,var(--c2) 50% 100%)}
.chips em{font-style:normal;font-weight:700;font-size:11.5px;align-self:center;margin:0 2px 0 6px}
.c .w{font-size:11.5px}
.c .p{font-size:8.5px;opacity:.9}
.c .h,.c .r,.c .e{position:absolute;font-size:7.5px;font-weight:700;line-height:1}
.c .h{top:1px;left:1px} .c .r{bottom:1px;right:1px} .c .e{bottom:1px;left:1px}
.c .dgm{position:absolute;top:0;right:0;background:#fff;color:var(--warn);font-size:7.5px;font-weight:700;line-height:1;padding:1px;border-left:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.c.out{outline:2px dashed var(--warn);outline-offset:-3px}
.c.rp::after{content:"R";font-size:7.5px;color:var(--shade);position:absolute;bottom:1px;right:1px}
.c.dim{opacity:.18}
.c.hit{outline:3px solid var(--num);outline-offset:1px;z-index:1}
.c.sel{outline:3px solid #000;outline-offset:1px;z-index:2}
/* 긴급양하: 고른 컨테이너 (Ctrl+클릭으로 여러 개) */
.c.pk{outline:3px solid #e00000;outline-offset:-3px;z-index:3}
.c.pk::before{content:"";position:absolute;inset:0;background:rgba(255,0,0,.38);pointer-events:none}
.m.pk{outline:2px solid #e00000;outline-offset:-1px;position:relative;z-index:2}
#bwM{margin-right:4px;padding:0 8px;background:#fff0f0;color:#b00000;border-color:#b00000}
#bwC{margin-right:8px;padding:0 8px}
#bwC:disabled{opacity:.45;cursor:default}
.bwf .er{flex-basis:100%;color:var(--warn);font-weight:700}
#bwM:disabled{opacity:.45;cursor:default}
.bwf{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:6px 12px 8px;border-top:1px solid var(--edge);font-size:12px;background:var(--chrome)}
.bwf .pkl{font-family:Consolas,monospace;font-weight:700;color:#b00000;word-break:break-all}
.bwf button{font:inherit;font-size:11.5px;border:1px solid var(--edge);background:var(--win);padding:1px 8px;cursor:pointer}
.bwf .ok{flex-basis:100%;color:#0a6b00;font-weight:700}
.side{display:flex;justify-content:space-between;font-size:10px;color:var(--fg2);margin:3px 22px 0 0}
/* 그림 전용 판 (window.__STATIC__) */
body.static #openBtn,body.static .tools,body.static #lay,body.static .zoom,body.static .rz,body.static #sortCol,body.static #bw,body.static #sheet{display:none!important}
/* 프로그램 없이 눌리는 동작: 칸 = :target 으로 상세 띄우기, 포트 = 숨은 라디오 + label */
.sd{display:none;z-index:20}
.sd:target{display:block}
.sd a.x,a.c{text-decoration:none}
.sd a.x{display:inline-block;color:var(--fg)}
.fr{position:fixed;top:0;left:0;opacity:0;pointer-events:none}
label.chipb{cursor:pointer}
label.allb{border:1px solid var(--edge);background:var(--win);padding:4px 10px;font-weight:700}
body.static a.c.b{cursor:pointer}
body.static{padding-bottom:90px}
body.static .gpw{max-height:none;overflow:visible}
body.static a.mini{text-decoration:none}
body.static .sbp .bwb{overflow:visible}
body.static .sbp .bay{max-width:var(--w);margin:0 auto}
body.static .sbp .tb a{color:inherit;font-weight:400;font-size:12px}
body.static .c.b{cursor:default}
i.swc{display:block;align-self:stretch}
#sheet,.sd{position:fixed;left:0;right:0;bottom:0;background:var(--chrome);border-top:2px solid var(--title);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
#sheet .in,.sd .in{max-width:1500px;margin:0 auto;display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center}
#sheet .cn,.sd .cn{font-family:Consolas,monospace;font-size:17px;font-weight:700}
#sheet dl,.sd dl{display:flex;flex-wrap:wrap;gap:3px 16px;margin:0;flex:1 1 300px;min-width:0}
#sheet dl div,.sd dl div{display:flex;gap:5px;align-items:baseline}
#sheet dt,.sd dt{font-size:11px;color:var(--fg2)}
#sheet dd,.sd dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
#sheet dd.dgv,.sd dd.dgv{color:var(--warn)}
body.drag{outline:3px dashed var(--num);outline-offset:-6px}
.emp{display:none}
/* Summary 크기 조절: 좁히면 플랜 오른쪽에 세로로 붙는 포트 범례가 됨 */
#sumWin{position:relative;container-type:inline-size;min-width:0;display:flex;flex-direction:column}
#sumWin>#sum{flex:1 1 auto;min-height:0;overflow:auto}
.rzl{top:0;left:-5px;width:10px;height:100%;cursor:ew-resize}
body.static #sumWin .rz{display:none}
.wrap.side{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start}
.wrap.side>*{grid-column:1;min-width:0}
.wrap.side>header{grid-column:1/-1}
.wrap.side>#sumWin{grid-column:2;grid-row:2/span 5}
@container (max-width:330px){
  #sum{padding:8px}
  #sum .kv{flex-direction:column;gap:1px}
  #sum .kv div{flex-wrap:wrap} #sum .kv span{white-space:nowrap}
  #sum .kv b{font-size:13.5px}
  #sum .rot{font-size:10.5px}
  #sum .chips{flex-direction:column;align-items:stretch;gap:4px}
  #sum .chips em{margin:6px 0 0;align-self:flex-start}
  #sum .chip{width:100%}
  #sum .chipb{flex:1 1 auto;min-width:0;justify-content:flex-start;padding:3px 8px}
  #sum .chipb b{font-size:13px}
  #sum #sortCol{align-self:flex-start;margin:0}
}
@container (max-width:210px){ #sum .chipb small{display:none} #sum .kv span{font-size:10.5px} }
/* 찾기 창 (Ctrl+F) */
#fbox{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:40;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;
  max-width:calc(100vw - 32px);padding:8px 10px;background:linear-gradient(#f7faff,#e3ebf6);border:1px solid #5d7fae;border-radius:8px;box-shadow:0 8px 24px rgba(0,20,60,.4);font-size:12.5px}
#fbox b{font-size:12.5px}
#fbox #q{width:170px;padding:4px 7px}
#fbox #qn{font-size:12px;min-width:0}
#fbox #fX{font:inherit;font-weight:700;border:1px solid #707f96;border-radius:3px;background:var(--btn,#eee);width:24px;height:24px;cursor:pointer;padding:0}
body.static #fbox{display:none}
/* 폰: Bay Plan 창은 화면 가득 */
#bw.full{display:block;padding:0}
#bw.full .bwin{position:absolute;left:0;top:0;width:100%!important;height:100%!important;max-width:none;max-height:none;border-radius:0;border:0}

.pvc .hint{color:var(--fg2)}
.et.pv td{text-align:right;cursor:pointer}
.et.pv td.z{color:#bbb;cursor:default}
.et.pv th.rh{position:sticky;left:0;background:#e3e3ee;z-index:1;cursor:pointer}
.et.pv thead th{cursor:pointer}
.et.pv .tot{font-weight:700;background:#f1f1f7}
.et.pv td:hover:not(.z){background:#ffd9d9}
.cnrow{display:none}
#saveBtn{background:#fff0f0;color:#b00000;border-color:#b00000;margin-right:6px}

dd.chg .ei,dd.chg{background:#fff3a6}
#eMsg{font-size:11.5px;margin-top:6px;flex-basis:100%}
#eMsg .er{color:var(--warn);font-weight:700}
#eMsg button{font:inherit;font-size:11.5px;border:1px solid var(--edge);background:var(--win);padding:1px 8px;cursor:pointer;margin-top:4px}
.c.ed::after{content:"\270E";position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:9px;line-height:1;color:var(--ck)}
#sheet .edt{display:none}
@media (min-width:900px){

/* ===== 겉모습: 윈도우 비스타(Aero) 느낌 — 유리 제목줄, 둥근 모서리, 부드러운 그림자, 광택 버튼 =====
   플랜 칸(색·테두리·글자)은 그대로 두고 창·버튼·입력칸만 바꿈. 이 묶음을 지우면 예전(클래식) 모습으로 돌아감 */

  --btn:linear-gradient(to bottom,#fbfdff 0,#eaf0f8 48%,#d9e3f1 52%,#edf2f9 100%);
  --btn-h:linear-gradient(to bottom,#f2fbff 0,#d8f0fd 48%,#b9e3fb 52%,#d6effd 100%);
}

.note{border-radius:6px;border-color:#d8c36a;background:linear-gradient(#fffbe0,#fff3b8);box-shadow:0 2px 6px rgba(25,55,100,.15)}
/* 버튼 */
.btn,.x,.tb button,.bwin .tb button,.etab button,.bwf button,#eMsg button{
  background:var(--btn);border:1px solid #707f96;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.75);color:#1b2433;text-shadow:none;transition:background .12s,border-color .12s}
.btn:hover,.x:hover,.tb button:hover,.bwin .tb button:hover,.etab button:hover,.bwf button:hover,#eMsg button:hover{background:var(--btn-h);border-color:#3c7fb1}
.btn:active,.x:active,.tb button:active{background:linear-gradient(#c4e5f6,#98d1ef);box-shadow:inset 0 1px 3px rgba(0,40,80,.35)}
.btn{padding:6px 14px}
.tb button{height:23px}
#edBtn[aria-pressed="true"]{background:linear-gradient(#c4e5f6,#98d1ef);color:#0b2a55;border-color:#2c628b;box-shadow:inset 0 1px 3px rgba(0,40,80,.35)}
#saveBtn,#bwM{background:linear-gradient(#fff5f4,#ffd9d6 50%,#ffc6c1 52%,#ffe1de);color:#a40000;border-color:#b3413a}
#bwC{background:linear-gradient(#f4f9ff,#d6e8ff 50%,#c2dcff 52%,#deecff);color:#0b3f94;border-color:#3d72c0}
#bwM:hover,#saveBtn:hover{background:linear-gradient(#fff,#ffcbc6);border-color:#8c1d16}
#bwX{background:linear-gradient(#f0b3ad 0,#d9615a 48%,#c13229 52%,#dc6a62 100%);color:#fff;border-color:#7a1c16;font-weight:700;min-width:38px;text-shadow:0 1px 1px rgba(0,0,0,.5)}
#bwX:hover{background:linear-gradient(#ffc9c4 0,#f07068 48%,#d8382e 52%,#f4837b 100%);border-color:#5e120d}
.chips #sortCol{background:linear-gradient(90deg,#ff4136 0 25%,#19c2b0 25% 50%,#ff85e0 50% 75%,#ff9f1a 75%) bottom/100% 4px no-repeat,var(--btn);border-radius:3px}
/* 입력칸 */
#ship,#q,.tb select,.pvc select,.ef,.ei{border:1px solid #9aa7ba;border-radius:3px;box-shadow:inset 0 1px 2px rgba(0,0,0,.08);background:#fff}
#ship:hover,#q:hover,.tb select:hover,.pvc select:hover{border-color:#3c7fb1}
.tb select{height:23px;color:#1b2433;text-shadow:none;font-weight:600}
/* 포트 칩 */
.chip{border-radius:4px;border-color:#8fa3c2;overflow:hidden;box-shadow:0 1px 2px rgba(25,55,100,.15)}
.chip.on{box-shadow:0 0 0 2px var(--num)}
.swc{border-right-color:#8fa3c2}
/* 플랜 칸은 또렷하게 (어두운 테두리 유지) */
.c,.m,.lg{border-color:var(--cell)}
.hbar,.mbar{background:var(--cell)}
.gh{border-left-color:#d5dde9}
.mini.cur span{background:var(--title);border-radius:3px}
/* Bay Plan 창 */
#bw{background:rgba(20,45,85,.22)}
.bwin{border-radius:8px;box-shadow:0 0 0 1px rgba(255,255,255,.55) inset,0 16px 48px rgba(0,20,60,.5)}
.bwf{background:linear-gradient(#f7faff,#e7eef8);border-top-color:#b9c7dc}
/* Container Editor 패널 */
#sheet{background:linear-gradient(#f4f8fd,#e3ebf6);border-color:#5d7fae}
#sheet .edt{background:var(--glass);text-shadow:0 1px 2px rgba(0,20,60,.65);padding:7px 10px}
@media (min-width:900px){#sheet{box-shadow:-6px 0 18px rgba(25,55,100,.3);border-left:1px solid #5d7fae}
  #sheet dd{border-color:#9aa7ba;border-radius:3px} #sheet .emp dd{background:#eef2f7}}
/* Editor / Pivot */
.etab button{border-radius:4px 4px 0 0;opacity:.85;height:23px}
.etab button.on{background:#fff;box-shadow:inset 0 -3px 0 #3d72c0;opacity:1}
.et thead th,.et.pv th.rh{background:linear-gradient(#f9fbfe,#e2eaf5)}
.et thead tr.efr th{background:#f1f5fb}
.et th,.et td{border-color:#c9d3e2}
.et.pv .tot{background:#edf2f9}
.pvc{background:linear-gradient(#f7faff,#e7eef8);border-bottom-color:#b9c7dc}
.rzc,.wr.se{opacity:.7}
</style>

function ink(hex){var r=parseInt(hex.substr(1,2),16),g=parseInt(hex.substr(3,2),16),b=parseInt(hex.substr(5,2),16);
  return (r*299+g*587+b*114)/1000>140?"#000":"#fff"}

function parseAsc(text){
  var lines=text.split(/\r?\n/), head=lines[0]||"", f604=head.indexOf("$604")===0;
  var hp=head.slice(4).split("/").map(function(s){return s.trim()});
  var out={voy:hp[2]||"",vsl:hp[1]||"",rotation:[],boxes:[],dg:{}}, inDg=false;
  for(var i=1;i<lines.length;i++){
    var l=lines[i];
    if(/^\$60\dPORT ROTATION\//.test(l)){var s=l.split("/")[1].trim();for(var k=0;k+3<=s.length;k+=3)out.rotation.push(s.slice(k,k+3));continue}
    if(l.indexOf("***")===0){inDg=/IMDG/i.test(l);continue}
    if(inDg){
      if(/^\d{6}/.test(l)){var no=l.slice(0,4),c=l.slice(6,8).trim(),un=l.slice(8,12).trim(),pg=l.slice(23,24).trim();
        if(c.length===2)c=c[0]+"."+c[1];
        (out.dg[no]=out.dg[no]||[]).push({cls:c,un:un,pg:pg})}
      continue}
    if(/^\d{6} /.test(l)&&+l.slice(0,2)>0&&l.slice(27,33).trim()){
      var t=l.slice(44,48).trim(), w=f604?l.slice(87,92):l.slice(80,85);
      var kg=/^\d+$/.test(w.trim())?+w:0; if(!kg)kg=(+l.slice(48,51).trim()||0)*100;
      var bay=+l.slice(0,2), tmp=l.slice(55,60).trim();
      // 타입 코드 두 가지: ISO(22GP·45GP·22TN) / CASP식(DC20·DCHC·TK20·RF2H·DC45)
      var iso=/^[0-9L]/.test(t), tail=t.slice(2), size, len, hc, tk;
      if(iso){size=t[0]==="2"?20:40;len=t[0]==="L"?45:size;hc=/^.[56]/.test(t)||t[0]==="L";tk=t[2]==="T"}
      else if(t){size=(tail==="20"||tail==="2H")?20:(tail==="40"||tail==="HC"||tail==="45"||tail==="4H")?40:(bay%2?20:40);
        len=tail==="45"?45:size;hc=tail==="HC"||tail==="2H"||tail==="4H"||tail==="45";tk=t.slice(0,2)==="TK"}
      else{size=bay%2?20:40;len=size;hc=false;tk=false}
      out.boxes.push({bay:bay,row:+l.slice(2,4),tier:+l.slice(4,6),cntr:l.slice(7,18).trim(),line:l.slice(19,27).trim(),
        pol:l.slice(27,30).trim(),pod:l.slice(30,33).trim(),dest:l.slice(39,44).trim(),type:t,size:size,len:len,
        lab:l.slice(53,55).trim(),ov:[92,101,104,95,98].map(function(c){return +l.slice(c,c+3).trim()||0}),   // H,P,S,F,A
        pol5:/^[A-Z]{5}$/.test(l.slice(188,193))?l.slice(188,193):"",pod5:/^[A-Z]{5}$/.test(l.slice(193,198))?l.slice(193,198):"",
        hc:hc,tk:tk,rt:iso?t[2]==="R":t.slice(0,2)==="RF",fe:l.slice(51,52)==="E"?"E":"F",kg:kg,
        rf:/C$/.test(tmp),temp:tmp,dgno:l.slice(60,64).trim(),li:i});
    }
  }
  return out;
}

function rowOrder(rs){ // 좌현(짝수) … 00 … 우현(홀수)
  var mxE=0,mxO=0,zero=false;rs.forEach(function(r){if(r===0)zero=true;else if(r%2)mxO=Math.max(mxO,r);else mxE=Math.max(mxE,r)});
  var m=Math.max(mxE,mxO+1),o=[];if(m%2)m++;
  for(var e=m;e>=2;e-=2)o.push(e); if(zero)o.push(0); for(var d=1;d<m;d+=2)o.push(d); return o;
}
function tiersOf(ts){
  var dk=ts.filter(function(t){return t>=70}),hd=ts.filter(function(t){return t<70}),D=[],H=[],t;
  if(dk.length)for(t=Math.max.apply(0,dk);t>=Math.min(82,Math.min.apply(0,dk));t-=2)D.push(t);
  if(hd.length)for(t=Math.max.apply(0,hd);t>=Math.min(2,Math.min.apply(0,hd));t-=2)H.push(t);
  return {D:D,H:H};
}
function detectShip(name){
  if(!SHIPS)return "";
  var t=name.toUpperCase().replace(/\.[^.]*$/,"").split(/[^A-Z0-9]+/).filter(Boolean),i,m;
  for(i=t.length-1;i>=0;i--)if(SHIPS[t[i]])return t[i];
  for(i=0;i<t.length;i++){m=/^([A-Z]{4})\d/.exec(t[i])||/^([A-Z]{3})\d/.exec(t[i]);if(m&&SHIPS[m[1]])return m[1]}
  return "";
}
function slotsOf(sh,bay){ // {"로우_티어": 1 일반 | 3 리퍼 플러그} 또는 null(모름)
  var b=sh.b[bay];
  if(!b){ if(bay%2)return null; var f=slotsOf(sh,bay-1),g=slotsOf(sh,bay+1); if(!f||!g)return null;
    var x={},q;for(q in f)if(g[q])x[q]=1;return x }
  var o={},r=sh.r[bay]||{},t,k;
  for(t in b)for(k=0;k<b[t].length;k+=2)o[+b[t].substr(k,2)+"_"+t]=1;
  for(t in r)for(k=0;k<r[t].length;k+=2)o[+r[t].substr(k,2)+"_"+t]=3;
  return o;
}
function outside(sh,boxes){var n=0,c={};boxes.forEach(function(b){var s=c[b.bay]===undefined?(c[b.bay]=slotsOf(sh,b.bay)):c[b.bay];if(!s||!s[b.row+"_"+b.tier])n++});return n}
function pickShip(code){ // 구조가 플랜과 너무 안 맞으면(3% 넘게 벗어나면) 쓰지 않음
  st.ship=code;st.shipBad=false;

}
function curShip(){return SHIPS&&st.ship&&!st.shipBad&&SHIPS[st.ship]||null}
function hatches(boxes,sh){
  var all={},ev={},cnt={0:0,2:0},k;
  boxes.forEach(function(b){all[b.bay]=1}); if(sh)for(k in sh.b)all[+k]=1;
  for(k in all)if(k%2===0){ev[+k]=1;cnt[k%4]++}
  var ph=cnt[0]>cnt[2]?0:2, m={};
  function hOf(y){if(y%2===0)return y;var a=ev[y+1],c=ev[y-1];
    return a&&!c?y+1:c&&!a?y-1:((y+1)%4===ph?y+1:y-1)}
  for(k in all){var h=hOf(+k);(m[h]=m[h]||{h:h,boxes:[],bays:[]}).bays.push(+k)}
  boxes.forEach(function(b){m[hOf(b.bay)].boxes.push(b)});
  return Object.keys(m).map(Number).sort(function(a,b){return a-b}).map(function(h){return m[h]});
}

// 해치 하나를 CASP처럼 두 장으로: 앞 20' 베이(fore) / 뒤 20' 베이 + 40'(aft, "03(02)")
function panels(H,sh){
  var map={},rset={},tset={},SL={};
  H.boxes.forEach(function(b){(map[b.bay]=map[b.bay]||{})[b.row+"_"+b.tier]=b;rset[b.row]=1;tset[b.tier]=1});
  var f=H.h-1,a=H.h+1,h=H.h;
  if(sh)[f,h,a].forEach(function(y){var s=SL[y]=slotsOf(sh,y);if(s&&(H.bays.indexOf(y)>=0||y===h))for(var q in s){var p=q.split("_");rset[p[0]]=1;tset[p[1]]=1}});
  var has=function(y){return !!map[y]||H.bays.indexOf(y)>=0};
  var P=[],mF=map[f]||{},mA=map[a]||{},m4=map[h]||{};
  function mk(kind){
    var fore=kind==="f", own=fore?mF:mA, S=fore?SL[f]:(SL[a]||SL[h]), n=0,kg=0,k;
    for(k in own){n++;kg+=own[k].kg} if(!fore)for(k in m4){n++;kg+=m4[k].kg}
    return {kind:kind,id:"bp"+h+kind,name:fore?pad(f):(has(a)?pad(a)+"("+pad(h)+")":"("+pad(h)+")"),n:n,kg:kg,
      cell:function(r,t){var key=r+"_"+t,b=own[key]||(!fore&&m4[key])||null,sv=S?S[key]:1;
        if(b){var Sb=b.bay===h?SL[h]:S;return {b:b,f40:b.bay===h,out:!!(Sb&&!Sb[key])}}
        if(fore&&m4[key])return {x:1};
        return {slot:sv||0}}};
  }
  if(has(f)||(!has(a)&&map[h]))P.push(mk("f"));
  if(has(a)||map[h]||(!P.length))P.push(mk("a"));
  return {P:P,rs:rowOrder(Object.keys(rset).map(Number)),T:tiersOf(Object.keys(tset).map(Number))};
}

// Bay Plan 창: 제목줄을 끌어 옮기기, 가장자리·모서리를 끌어 크기 조절, □·제목줄 더블클릭 = 최대화/이전 크기
// 자리·크기는 기억됨(ascBwBox). 손잡이를 더블클릭하면 처음 자리(가운데)로.
var BWDRAG=false, bwApply=function(){};
(function(){
  var bw=$("bw"),win=bw.firstElementChild,d=null,box=null,maxed=false;
  try{var sv=JSON.parse(localStorage.getItem("ascBwBox")||"null");if(sv){box=sv.b||null;maxed=!!sv.m}}catch(_){}
  win.insertAdjacentHTML("beforeend",["n","s","e","w","nw","ne","sw","se"].map(function(k){
    return '<div class="wr '+k+'" data-wr="'+k+'" title="끌어서 크기 조절 (더블클릭: 처음 자리로)"></div>'}).join(""));
  function save(){try{localStorage.setItem("ascBwBox",JSON.stringify({b:box,m:maxed}))}catch(_){}}
  function fit(b){var W=window.innerWidth,H=window.innerHeight;
    b.w=Math.max(Math.min(320,W),Math.min(b.w,W));b.h=Math.max(Math.min(200,H),Math.min(b.h,H));
    b.x=Math.max(120-b.w,Math.min(b.x,W-120));b.y=Math.max(0,Math.min(b.y,H-40));return b}
  function put(b){win.style.left=b.x+"px";win.style.top=b.y+"px";win.style.width=b.w+"px";win.style.height=b.h+"px"}
  bwApply=function(){
    var ph=isPhone();bw.classList.toggle("full",ph);   // 폰: 항상 화면 가득 (저장해 둔 PC용 자리는 안 씀)
    if(ph){bw.classList.remove("free");win.style.left=win.style.top=win.style.width=win.style.height="";return}
    if(maxed){bw.classList.add("free");put({x:0,y:0,w:window.innerWidth,h:window.innerHeight})}
    else if(box){bw.classList.add("free");put(fit(box))}
    else{bw.classList.remove("free");win.style.left=win.style.top=win.style.width=win.style.height=""}
    $("bwZ").textContent=maxed?"❐":"□";
  };
  function cur(){var r=win.getBoundingClientRect();return {x:r.left,y:r.top,w:r.width,h:r.height}}
  win.addEventListener("pointerdown",function(e){
    if(e.button!==0)return;
    var k=e.target.dataset&&e.target.dataset.wr;
    if(!k){if(!e.target.closest(".tb")||e.target.closest("button"))return;k="move"}
    if(maxed){ if(k!=="move")return;   // 최대화 상태에서 제목줄을 끌면 이전 크기로 돌아오며 따라옴
      var w0=(box&&box.w)||Math.min(700,window.innerWidth),h0=(box&&box.h)||Math.min(600,window.innerHeight);
      maxed=false;box={x:e.clientX-w0/2,y:Math.max(0,e.clientY-12),w:w0,h:h0};bwApply()}
    else if(!box){box=cur();bw.classList.add("free");put(box)}
    d={k:k,x:e.clientX,y:e.clientY,b:{x:box.x,y:box.y,w:box.w,h:box.h},moved:false};
    e.target.setPointerCapture(e.pointerId);document.body.classList.add("rzing");e.preventDefault()});
  win.addEventListener("pointermove",function(e){if(!d)return;
    var dx=e.clientX-d.x,dy=e.clientY-d.y,b=d.b,n={x:b.x,y:b.y,w:b.w,h:b.h},k=d.k,MW=320,MH=200;
    if(Math.abs(dx)+Math.abs(dy)>3)d.moved=true;
    if(k==="move"){n.x=b.x+dx;n.y=b.y+dy}
    else{
      if(k.indexOf("e")>=0)n.w=Math.max(MW,b.w+dx);
      if(k.indexOf("s")>=0)n.h=Math.max(MH,b.h+dy);
      if(k.indexOf("w")>=0){n.w=Math.max(MW,b.w-dx);n.x=b.x+b.w-n.w}
      if(k.indexOf("n")>=0){n.h=Math.max(MH,b.h-dy);n.y=b.y+b.h-n.h}}
    box=fit(n);put(box)});
  function end(){if(!d)return;if(d.moved){BWDRAG=true;setTimeout(function(){BWDRAG=false},0)}
    d=null;document.body.classList.remove("rzing");save()}
  win.addEventListener("pointerup",end);win.addEventListener("pointercancel",end);
  function toggleMax(){maxed=!maxed;bwApply();save()}
  $("bwZ").onclick=toggleMax;
  win.addEventListener("dblclick",function(e){
    if(e.target.dataset&&e.target.dataset.wr){box=null;maxed=false;bwApply();save();return}
    if(e.target.closest(".tb")&&!e.target.closest("button"))toggleMax()});
  window.addEventListener("resize",function(){if(!bw.hidden)bwApply()});
})();

    try{history.replaceState(null,"",location.pathname)}catch(_){}
  }
  if(window.launchQueue)launchQueue.setConsumer(function(p){if(p.files&&p.files[0])p.files[0].getFile().then(readFile)});   // PC 설치판: .asc 연결 프로그램
}
