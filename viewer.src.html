<title>PLAN VIEWER MADE BY JUNJAE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: CASP 방식 — General Plan(전 베이, 선수가 오른쪽)이 메인. 베이를 더블클릭하면 Bay Plan 창이 위에 뜸. 한 가지 모습으로 고정(밝은 회색 바탕). */
:root{
  color-scheme:light;
  --desk:#bdbdbd; --win:#ffffff; --chrome:#d4d0c8; --edge:#000000; --shade:#808080;
  --fg:#000000; --fg2:#3a3a3a; --num:#0000c8; --title:#000080; --title-fg:#ffffff; --warn:#d00000;
  --p0:#ffff00; --k0:#000; --p1:#0000ff; --k1:#fff; --p2:#ff0000; --k2:#fff; --p3:#00ffff; --k3:#000;
  --p4:#00e000; --k4:#000; --p5:#ff00ff; --k5:#000; --p6:#8000c0; --k6:#fff; --p7:#ff8000; --k7:#000;
  --p8:#008080; --k8:#fff; --p9:#808000; --k9:#fff;
  --sans:Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--fg);font-family:var(--sans);font-size:13px;line-height:1.4;
  padding-block:10px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:none;margin:0;display:flex;flex-direction:column;gap:10px}
#plan{width:100%;margin:0}
.win{background:var(--win);border:1px solid var(--edge);box-shadow:2px 2px 0 var(--shade);min-width:0}
.tb{background:var(--title);color:var(--title-fg);font-weight:700;font-size:13px;padding:3px 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tb small{font-weight:400;opacity:.9;font-variant-numeric:tabular-nums}
.body{padding:8px 10px}
header.win .body{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;background:var(--chrome)}
#logo{width:56px;height:56px;object-fit:contain;background:var(--win);border:1px solid var(--edge);flex:none}
.file{font-family:Consolas,monospace;font-size:12px;min-width:0;overflow-wrap:anywhere;flex:1 1 200px}
.btn,.seg button,#ship,#q,.x{font:inherit;font-size:12.5px;background:var(--chrome);color:var(--fg);border:1px solid var(--edge);
  box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 var(--shade);padding:5px 12px;cursor:pointer;border-radius:0}
.btn{font-weight:700}
.btn:focus-visible,.chipb:focus-visible,.swc:focus-visible,.c:focus-visible,.mini:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--num);outline-offset:1px}
.note{background:#ffffe1;border:1px solid var(--edge);padding:6px 10px;font-size:12.5px}
.err{color:var(--warn)}
.kv{display:flex;flex-wrap:wrap;gap:4px 20px;font-variant-numeric:tabular-nums}
.kv div{display:flex;gap:5px;align-items:baseline}
.kv span{color:var(--fg2);font-size:11.5px}
.kv b{font-size:15px}
.kv small{font-size:11.5px;font-weight:400}
.rot{font-family:Consolas,monospace;font-size:11.5px;color:var(--fg2);overflow-wrap:anywhere;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{display:inline-flex;align-items:stretch;border:1px solid var(--edge);background:var(--win)}
.chip.on{box-shadow:0 0 0 2px var(--num)}
.swc{appearance:none;-webkit-appearance:none;width:26px;min-height:24px;height:auto;padding:0;border:0;border-right:1px solid var(--edge);background:none;cursor:pointer;border-radius:0}
.swc::-webkit-color-swatch-wrapper{padding:0}
.swc::-webkit-color-swatch{border:0;border-radius:0}
.swc::-moz-color-swatch{border:0;border-radius:0}
.chipb{font:inherit;display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--fg);padding:2px 8px;cursor:pointer;font-variant-numeric:tabular-nums;font-size:12px}
.chipb small{color:var(--fg2);font-size:11px}
.chips .x{padding:2px 8px;font-size:11.5px;margin-left:6px}
.chips #sortCol{margin:0 4px 0 0;font-weight:700;background:linear-gradient(90deg,#ff4136 0 25%,#19c2b0 25% 50%,#ff85e0 50% 75%,#ff9f1a 75%) bottom/100% 4px no-repeat,var(--chrome);padding-bottom:5px}
.hint{font-size:11.5px;color:var(--fg2);margin-top:6px}
.tools{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.tools label{font-size:12px}
.seg{display:inline-flex}
.seg button{margin-right:-1px}
.seg button[aria-pressed="true"]{box-shadow:inset 1px 1px 0 var(--shade),inset -1px -1px 0 #fff;background:var(--win);font-weight:700}
#ship,#q{background:var(--win);box-shadow:inset 1px 1px 0 var(--shade);cursor:auto;padding:5px 7px;max-width:100%}
#q{width:150px;font-family:Consolas,monospace;text-transform:uppercase}
#qn{font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:11.5px;align-items:center}
.legend span{display:inline-flex;gap:5px;align-items:center}
.lg{width:15px;height:15px;border:1px solid var(--edge);display:inline-flex;align-items:center;justify-content:center;font-size:9px;background:var(--win);line-height:1}
.lg.f40{background:repeating-linear-gradient(135deg,rgba(0,0,0,.5) 0 1px,transparent 1px 4px),var(--p0)}
.lg.out{outline:2px dashed var(--warn);outline-offset:-2px;background:var(--p3)}

/* General Plan */
.gpw{overflow:auto;max-height:max(300px,calc(100vh - 130px));overscroll-behavior:contain}
@media (hover:none) and (orientation:landscape) and (max-height:519px){.gpw{max-height:max(200px,calc(100vh - 58px));max-height:max(200px,calc(100dvh - 58px))}}   /* 가로로 눕힌 폰: 화면 높이를 거의 다 씀 */
.gp{display:flex;flex-wrap:nowrap;width:max-content;margin-left:auto;gap:10px 4px;padding:8px 6px;align-items:flex-start}
.gp.wrap{flex-direction:row-reverse;flex-wrap:wrap;width:auto;margin-left:0;justify-content:flex-start;gap:18px 4px}
.gp.wrap .gh{border-left:0;border-right:1px solid #d0d0d0}
.zoom{display:inline-flex;gap:3px;align-items:center}
#gpWin{position:relative;align-self:flex-start;width:100%;max-width:100%}
.rz{position:absolute;z-index:3;touch-action:none}
.rzr{top:0;right:-5px;width:10px;height:100%;cursor:ew-resize}
.rzb{left:0;bottom:-5px;height:10px;width:100%;cursor:ns-resize}
.rzc{right:-3px;bottom:-3px;width:18px;height:18px;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 0 50%,var(--shade) 50% 58%,transparent 58% 68%,var(--shade) 68% 76%,transparent 76% 86%,var(--shade) 86% 94%,transparent 94%)}
body.rzing{user-select:none;-webkit-user-select:none}
.tb button,.tb select{font:inherit;font-weight:700;font-size:12px;background:var(--chrome);color:var(--fg);border:1px solid var(--edge);
  box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 var(--shade);min-width:26px;height:22px;padding:0 6px;cursor:pointer;border-radius:0}
.tb .sp{flex:1}
.gh{display:flex;flex-direction:column;gap:6px;align-items:center;padding:0 5px;border-left:1px solid #d0d0d0}
.mini{font:inherit;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--fg)}
.mini span{font-size:9.5px;font-family:Consolas,monospace;letter-spacing:.02em}
.mg{display:grid;grid-template-columns:repeat(var(--n),var(--ms,15px)) calc(var(--ms,15px) + 5px);padding:0 0 1px 0}
.m{height:var(--ms,15px);border:1px solid var(--edge);margin:0 -1px -1px 0;background:var(--win);font-size:calc(var(--ms,15px) - 3px);line-height:calc(var(--ms,15px) - 3px);text-align:center;overflow:hidden}
.m{position:relative}
.m i{position:absolute;font-style:normal;font-weight:700;font-family:Arial,sans-serif;font-size:calc(var(--ms,15px) * .44);line-height:1;letter-spacing:-.04em}
.m .mh{top:0;left:1px;color:var(--ck)}
.m .md{top:0;right:0;background:#fff;color:var(--warn);padding:0 1px}
.m .me{bottom:0;left:1px;color:var(--ck2)}
.m .mrr{bottom:0;right:1px;color:var(--ck2)}
.m.n{visibility:hidden}
.m.b{background:var(--c)}
.m.f40{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ck,#000) 62%,transparent) 0 1px,transparent 1px 3px),var(--c)}
.m.dim{opacity:.18}
.mbar{grid-column:1/-1;height:2px;background:var(--edge);margin:3px calc(var(--ms,15px) + 5px) 2px 0}
.mr,.mt{font-family:Arial,sans-serif;font-size:calc(var(--ms,15px) * .56);color:var(--num);line-height:1;display:flex;align-items:center;justify-content:center;letter-spacing:-.03em}
.mr{height:calc(var(--ms,15px) * .8)}
.mt{padding-left:3px}

.m.hit{outline:2px solid var(--num);outline-offset:0;position:relative;z-index:1}
.mini.cur span{background:var(--title);color:var(--title-fg);padding:0 4px}
.mini:hover span{text-decoration:underline}
.mini span{font-size:max(9px,calc(var(--ms,15px) * .73))}
/* Bay Plan 창 */
#bw{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:15;display:flex;align-items:center;justify-content:center;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(74px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.bwin{width:var(--bw,600px);max-width:100%;max-height:100%;display:flex;flex-direction:column;box-shadow:4px 4px 0 rgba(0,0,0,.5)}
.bwin .tb{align-items:center;flex-wrap:nowrap}
.bwin .tb .sp{flex:1}
.bwin .tb #bwT,.bwin .tb #bwS,.bwin .tb button{white-space:nowrap;flex:none}
.bwin .tb{overflow:hidden}
.bwin .tb button{font:inherit;font-weight:700;font-size:12px;background:var(--chrome);color:var(--fg);border:1px solid var(--edge);
  box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 var(--shade);min-width:26px;height:22px;padding:0 6px;cursor:pointer;border-radius:0}
.bwb{overflow:auto;padding:10px 12px 12px;flex:1 1 auto;min-height:0}
/* Bay Plan 창 옮기기·크기 조절 (윈도우 창처럼) */
.bwin{position:relative}
.bwin .tb{cursor:move;user-select:none;-webkit-user-select:none;touch-action:none}
.bwin .tb button{cursor:pointer}
#bw.free{display:block}
#bw.free .bwin{position:absolute;max-width:none;max-height:none}
.wr{position:absolute;z-index:6;touch-action:none}
.wr.n{top:-4px;left:8px;right:8px;height:8px;cursor:ns-resize}
.wr.s{bottom:-4px;left:8px;right:8px;height:8px;cursor:ns-resize}
.wr.e{right:-4px;top:8px;bottom:8px;width:8px;cursor:ew-resize}
.wr.w{left:-4px;top:8px;bottom:8px;width:8px;cursor:ew-resize}
.wr.nw{left:-5px;top:-5px;width:13px;height:13px;cursor:nwse-resize}
.wr.ne{right:-5px;top:-5px;width:13px;height:13px;cursor:nesw-resize}
.wr.sw{left:-5px;bottom:-5px;width:13px;height:13px;cursor:nesw-resize}
.wr.se{right:-5px;bottom:-5px;width:16px;height:16px;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 0 50%,var(--shade) 50% 58%,transparent 58% 68%,var(--shade) 68% 76%,transparent 76% 86%,var(--shade) 86% 94%,transparent 94%)}
.bwb .bay{max-width:none}
/* Bay Plan */
.bays{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:flex-start;padding:8px 10px 10px}
.bay{flex:1 1 280px;min-width:0;max-width:var(--w)}
.bt{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin:0 22px 4px 0;font-variant-numeric:tabular-nums}
.bt b{font-size:13px}
.g{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr)) 22px;gap:1px;font-variant-numeric:tabular-nums}
.rl,.tl{font-size:11px;color:var(--num);display:flex;align-items:center;justify-content:center;min-width:0;height:16px}
.tl{height:auto}
.sw{font-size:9.5px;color:var(--fg2);display:flex;align-items:center;justify-content:center;height:13px;min-width:0}
.sw.z{color:transparent}
.hbar{grid-column:1/-1;height:6px;background:var(--edge);margin:4px 23px 4px 0}
.c{font:inherit;height:var(--ch,34px);min-width:0;padding:0;border:1px solid var(--edge);border-radius:0;background:var(--win);position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;overflow:hidden;color:var(--fg)}
.c.no{visibility:hidden}
.c.xx{font-size:11px;color:var(--fg)}
.c.b{background:var(--c);color:var(--ck);cursor:pointer}
.c.b.f40{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ck,#000) 38%,transparent) 0 1px,transparent 1px 6px),var(--c)}
.c.b.pp{background:linear-gradient(to bottom,var(--c) 0 60%,var(--c2) 60% 100%)}
.c.b.pp .p,.c.b.pp .r,.c.b.pp .e{color:var(--ck2);opacity:1}
.c.b.pp .w{position:absolute;inset:0 0 40% 0;display:flex;align-items:center;justify-content:center}
.c.b.pp .p{position:absolute;inset:60% 0 0 0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:9.5px;letter-spacing:.02em}
.c.b.pp.f40{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ck,#000) 38%,transparent) 0 1px,transparent 1px 6px) top/100% 60% no-repeat,linear-gradient(to bottom,var(--c) 0 60%,var(--c2) 60% 100%)}
.m.b.pp{background:linear-gradient(to bottom,var(--c) 0 50%,var(--c2) 50% 100%)}
.m.b.pp.f40{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ck,#000) 62%,transparent) 0 1px,transparent 1px 3px) top/100% 50% no-repeat,
  repeating-linear-gradient(135deg,color-mix(in srgb,var(--ck2,#000) 62%,transparent) 0 1px,transparent 1px 3px) bottom/100% 50% no-repeat,
  linear-gradient(to bottom,var(--c) 0 50%,var(--c2) 50% 100%)}
.chips em{font-style:normal;font-weight:700;font-size:11.5px;align-self:center;margin:0 2px 0 6px}
.c .w{font-size:11.5px}
.c .p{font-size:8.5px;opacity:.9}
.c .h,.c .r,.c .e{position:absolute;font-size:7.5px;font-weight:700;line-height:1}
.c .h{top:1px;left:1px} .c .r{bottom:1px;right:1px} .c .e{bottom:1px;left:1px}
.c .dgm{position:absolute;top:0;right:0;background:#fff;color:var(--warn);font-size:7.5px;font-weight:700;line-height:1;padding:1px;border-left:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.c.out{outline:2px dashed var(--warn);outline-offset:-3px}
.c.rp::after{content:"R";font-size:7.5px;color:var(--shade);position:absolute;bottom:1px;right:1px}
.c.dim{opacity:.18}
.c.hit{outline:3px solid var(--num);outline-offset:1px;z-index:1}
.c.sel{outline:3px solid #000;outline-offset:1px;z-index:2}
/* 긴급양하: 고른 컨테이너 (Ctrl+클릭으로 여러 개) */
.c.pk{outline:3px solid #e00000;outline-offset:-3px;z-index:3}
.c.pk::before{content:"";position:absolute;inset:0;background:rgba(255,0,0,.38);pointer-events:none}
.m.pk{outline:2px solid #e00000;outline-offset:-1px;position:relative;z-index:2}
#bwM{margin-right:4px;padding:0 8px;background:#fff0f0;color:#b00000;border-color:#b00000}
#bwC{margin-right:8px;padding:0 8px}
#bwC:disabled{opacity:.45;cursor:default}
.bwf .er{flex-basis:100%;color:var(--warn);font-weight:700}
#bwM:disabled{opacity:.45;cursor:default}
.bwf{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:6px 12px 8px;border-top:1px solid var(--edge);font-size:12px;background:var(--chrome)}
.bwf .pkl{font-family:Consolas,monospace;font-weight:700;color:#b00000;word-break:break-all}
.bwf button{font:inherit;font-size:11.5px;border:1px solid var(--edge);background:var(--win);padding:1px 8px;cursor:pointer}
.bwf .ok{flex-basis:100%;color:#0a6b00;font-weight:700}
.side{display:flex;justify-content:space-between;font-size:10px;color:var(--fg2);margin:3px 22px 0 0}
/* 그림 전용 판 (window.__STATIC__) */
body.static #openBtn,body.static .tools,body.static #lay,body.static .zoom,body.static .rz,body.static #sortCol,body.static #bw,body.static #sheet{display:none!important}
/* 프로그램 없이 눌리는 동작: 칸 = :target 으로 상세 띄우기, 포트 = 숨은 라디오 + label */
.sd{display:none;z-index:20}
.sd:target{display:block}
.sd a.x,a.c{text-decoration:none}
.sd a.x{display:inline-block;color:var(--fg)}
.fr{position:fixed;top:0;left:0;opacity:0;pointer-events:none}
label.chipb{cursor:pointer}
label.allb{border:1px solid var(--edge);background:var(--win);padding:4px 10px;font-weight:700}
body.static a.c.b{cursor:pointer}
body.static{padding-bottom:90px}
body.static .gpw{max-height:none;overflow:visible}
body.static a.mini{text-decoration:none}
body.static .sbp .bwb{overflow:visible}
body.static .sbp .bay{max-width:var(--w);margin:0 auto}
body.static .sbp .tb a{color:inherit;font-weight:400;font-size:12px}
body.static .c.b{cursor:default}
i.swc{display:block;align-self:stretch}
#sheet,.sd{position:fixed;left:0;right:0;bottom:0;background:var(--chrome);border-top:2px solid var(--title);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
#sheet .in,.sd .in{max-width:1500px;margin:0 auto;display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center}
#sheet .cn,.sd .cn{font-family:Consolas,monospace;font-size:17px;font-weight:700}
#sheet dl,.sd dl{display:flex;flex-wrap:wrap;gap:3px 16px;margin:0;flex:1 1 300px;min-width:0}
#sheet dl div,.sd dl div{display:flex;gap:5px;align-items:baseline}
#sheet dt,.sd dt{font-size:11px;color:var(--fg2)}
#sheet dd,.sd dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
#sheet dd.dgv,.sd dd.dgv{color:var(--warn)}
body.drag{outline:3px dashed var(--num);outline-offset:-6px}
.emp{display:none}
/* Summary 크기 조절: 좁히면 플랜 오른쪽에 세로로 붙는 포트 범례가 됨 */
#sumWin{position:relative;container-type:inline-size;min-width:0;display:flex;flex-direction:column}
#sumWin>#sum{flex:1 1 auto;min-height:0;overflow:auto}
.rzl{top:0;left:-5px;width:10px;height:100%;cursor:ew-resize}
body.static #sumWin .rz{display:none}
.wrap.side{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start}
.wrap.side>*{grid-column:1;min-width:0}
.wrap.side>header{grid-column:1/-1}
.wrap.side>#sumWin{grid-column:2;grid-row:2/span 5}
@container (max-width:330px){
  #sum{padding:8px}
  #sum .kv{flex-direction:column;gap:1px}
  #sum .kv div{flex-wrap:wrap} #sum .kv span{white-space:nowrap}
  #sum .kv b{font-size:13.5px}
  #sum .rot{font-size:10.5px}
  #sum .chips{flex-direction:column;align-items:stretch;gap:4px}
  #sum .chips em{margin:6px 0 0;align-self:flex-start}
  #sum .chip{width:100%}
  #sum .chipb{flex:1 1 auto;min-width:0;justify-content:flex-start;padding:3px 8px}
  #sum .chipb b{font-size:13px}
  #sum #sortCol{align-self:flex-start;margin:0}
}
@container (max-width:210px){ #sum .chipb small{display:none} #sum .kv span{font-size:10.5px} }
/* 끌어서 고르기 (네모) */
#band{position:fixed;z-index:70;border:1px dashed #b00000;background:rgba(255,40,40,.14);pointer-events:none}
#band.none{border:1px dashed #4d6fa8;background:rgba(90,140,220,.10)}   /* Ctrl 없는 왼쪽 끌기: 네모만 보이고 아무것도 고르지 않음 */
#band.off{border-color:#3a4a66;background:rgba(90,110,150,.2)}
#band.del{border:2px solid #000;background:repeating-linear-gradient(45deg,rgba(0,0,0,.28) 0 6px,rgba(0,0,0,.08) 6px 12px)}
body.banding{user-select:none;-webkit-user-select:none;cursor:crosshair}
/* EXPORT PLAN 메뉴 */
.expw{position:relative;display:inline-block}
#expMenu{position:absolute;right:0;top:calc(100% + 4px);z-index:45;min-width:190px;padding:4px;background:var(--win);border:1px solid #5d7fae;border-radius:6px;box-shadow:0 10px 28px rgba(0,20,60,.35)}
#expMenu button{display:flex;justify-content:space-between;align-items:baseline;gap:14px;width:100%;font:inherit;font-weight:700;text-align:left;padding:8px 10px;border:0;background:none;color:var(--fg);cursor:pointer;border-radius:4px}
#expMenu button:hover,#expMenu button:focus-visible{background:#dbe7fb}
#expMenu small{font-weight:400;color:var(--fg2)}
body.empty .expw{display:none}
/* 도움말 창 (F1) */
#help{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(20,45,85,.28);padding:16px}
.hwin{width:min(460px,100%);max-height:100%;overflow:auto;box-shadow:0 16px 48px rgba(0,20,60,.5)}
.hwin .tb{display:flex;align-items:center}.hwin .tb .sp{flex:1}
.hwin .tb button{font:inherit;font-weight:700;width:26px;height:22px;border:1px solid #7a1c16;border-radius:3px;background:#c13229;color:#fff;cursor:pointer;padding:0}
.hwin table{border-collapse:collapse;width:100%}
.hwin td{padding:6px 6px;border-bottom:1px solid #dfe6f1;vertical-align:top}
.hwin td:first-child{white-space:nowrap;width:1%;padding-right:14px}
.hwin kbd{display:inline-block;font:inherit;font-weight:700;font-size:12px;padding:1px 6px;border:1px solid #8090a8;border-bottom-width:2px;border-radius:4px;background:#f6f8fc}
body.empty #helpBtn{display:inline-block}
#ask{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(20,45,85,.28);padding:16px}
#ask p{margin:4px 0 14px;font-size:13.5px;word-break:break-all}
.askb{display:flex;justify-content:flex-end;gap:8px}
.askb button{font:inherit;font-weight:700;min-width:84px;padding:6px 14px;border:1px solid #707f96;border-radius:4px;background:var(--win);color:var(--fg);cursor:pointer}
#askY{background:#c13229;color:#fff;border-color:#7a1c16}
/* 지정중 알림: 컨테이너가 골라져 있으면 General Plan 제목줄에 뜸. 마우스를 올리면 SzTp 별 개수 */
#pkBtn{font:inherit;font-size:12px;font-weight:700;padding:1px 9px;margin-right:2px;border:1px solid #7a1c16;border-radius:3px;background:#d8382e;color:#fff;white-space:nowrap;cursor:default;text-shadow:none;animation:pkb 1.2s ease-in-out infinite}
@keyframes pkb{50%{background:#ff7a70}}
@media (prefers-reduced-motion:reduce){#pkBtn{animation:none}}
#pkTip{position:fixed;z-index:75;min-width:150px;padding:8px 10px;background:var(--win);color:var(--fg);border:1px solid #7a1c16;border-radius:6px;box-shadow:0 10px 28px rgba(0,20,60,.35);font-size:12.5px;pointer-events:none}
#pkTip table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
#pkTip td{padding:2px 4px}#pkTip td:last-child{text-align:right;font-weight:700}
#pkTip tr.tt td{border-top:1px solid #8fa3c0;font-weight:700}
/* 3D VIEW: General Plan 바로 위에 뜨는 창 */
#v3 .tb{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}#v3 .tb .sp{flex:1}#v3 .tb small{font-weight:400;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#v3 .tb button{font:inherit;font-size:12px;font-weight:700;padding:1px 9px;border:1px solid var(--edge);border-radius:3px;background:var(--chrome);color:var(--fg);cursor:pointer;white-space:nowrap;text-shadow:none}
#v3 .tb button[aria-pressed="true"]{background:#0b3f94;color:#fff}
#v3X{background:#c13229!important;color:#fff!important;border-color:#7a1c16!important;min-width:30px}
.v3b{position:relative;height:min(520px,62vh);background:linear-gradient(#a9cdea,#dcebf6 70%,#eef5fa);overflow:hidden;border-radius:0 0 7px 7px}
#v3C{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#v3C.pt{cursor:pointer}
.v3a{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:72px;font-size:22px;border:1px solid #5d7fae;border-radius:8px;background:rgba(255,255,255,.82);color:#0b3f94;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
.v3a:hover{background:#fff}
#v3L{left:10px}#v3Rt{right:10px}
#v3Tip{position:absolute;padding:3px 8px;background:#10254a;color:#fff;font-size:12px;font-weight:700;border-radius:4px;pointer-events:none;white-space:nowrap}
#sum #v3Btn{margin-left:4px}
body.empty #v3,body.static #v3{display:none!important}
/* 열어 둔 플랜 탭: 두 개 이상 열었을 때만 보임. 한 번에 하나만 화면에 뜸 */
#tabs{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 0}
#tabs .tab{display:inline-flex;align-items:center;border:1px solid #5d7fae;border-bottom-width:3px;border-radius:7px 7px 0 0;background:linear-gradient(#f4f8fd,#dfe8f5);overflow:hidden}
#tabs .tab.on{background:linear-gradient(#5b9bf0,#2468d6);border-color:#0b3f94}
#tabs .tab button{font:inherit;border:0;background:none;cursor:pointer;color:var(--fg);padding:6px 10px}
#tabs .tab .tn{font-weight:700}#tabs .tab .tn small{font-weight:400;opacity:.8;margin-left:6px}
#tabs .tab.on button{color:#fff;text-shadow:0 1px 2px rgba(0,20,60,.6)}
#tabs .tab .tx{padding:6px 8px 6px 2px;opacity:.75}#tabs .tab .tx:hover{opacity:1}
body.static #tabs{display:none!important}
/* 찾기 창 (Alt+F) */
#fbox{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:40;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;
  max-width:calc(100vw - 32px);padding:8px 10px;background:linear-gradient(#f7faff,#e3ebf6);border:1px solid #5d7fae;border-radius:8px;box-shadow:0 8px 24px rgba(0,20,60,.4);font-size:12.5px}
#fbox b{font-size:12.5px}
#fbox{cursor:move;touch-action:none;user-select:none;-webkit-user-select:none}
#fbox #q{cursor:text;user-select:text;-webkit-user-select:text;width:230px;padding:4px 7px}
#fbox #qn{font-size:12px;min-width:0}
#fbox #fX{font:inherit;font-weight:700;border:1px solid #707f96;border-radius:3px;background:var(--btn,#eee);width:24px;height:24px;cursor:pointer;padding:0}
body.static #fbox{display:none}
/* 폰: Bay Plan 창은 화면 가득 */
#bw.full{display:block;padding:0}
#bw.full .bwin{position:absolute;left:0;top:0;width:100%!important;height:100%!important;max-width:none;max-height:none;border-radius:0;border:0}
#bw.full .bwin>.tb{border-radius:0;padding-top:calc(6px + env(safe-area-inset-top,0px))}
#bw.full .wr,#bw.full #bwZ{display:none}
#bw.full .bwf{border-radius:0}
#bw.full .bwin>.tb{flex-wrap:wrap;overflow:visible;row-gap:4px}
#bw.full .bwin>.tb #bwP,#bw.full .bwin>.tb #bwN{display:none}
.bwk{display:none;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--edge);background:var(--chrome);flex:none}
.bwk .sp{flex:1}
.bwk button{font:inherit;font-size:14px;font-weight:700;min-height:40px;min-width:44px;padding:0 12px;border:1px solid var(--edge);background:var(--win);color:var(--fg);border-radius:4px;cursor:pointer}
#bwMul[aria-pressed="true"]{background:#b00000;color:#fff;border-color:#700}
#bwX2{background:#c13229;color:#fff;border-color:#7a1c16}
#bw.full .bwk{display:flex;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
@media (hover:none){.bwk{display:flex}}
body:has(#bw.full:not([hidden])) #sheet{bottom:calc(57px + env(safe-area-inset-bottom,0px));max-height:45vh;overflow:auto}   /* 폰: 상세 창이 아래 줄(창 닫기)을 가리지 않게 */
#bw.full .bwin .tb{cursor:default}
/* Editor(목록) / Pivot */
body.static #edWin,body.static #edBtn{display:none}
#edBtn{margin-right:6px}
#edBtn[aria-pressed="true"]{background:var(--title);color:var(--title-fg);box-shadow:inset 1px 1px 0 rgba(0,0,0,.5)}
#edWin .tb{align-items:center;gap:6px}
.etab button{font:inherit;font-weight:700;font-size:12px;border:1px solid var(--edge);background:var(--chrome);color:var(--fg);height:22px;padding:0 12px;cursor:pointer;border-radius:0;opacity:.75}
.etab button.on{background:#fff;opacity:1;box-shadow:inset 0 -3px 0 var(--num)}
#edWin .fo{font-size:12px;font-weight:400;display:inline-flex;gap:4px;align-items:center;cursor:pointer}
#edCnt{font-weight:400}
.edw{overflow:auto;max-height:420px;background:var(--win)}
table.et{border-collapse:collapse;font-size:12px;font-family:Consolas,"Malgun Gothic",monospace;white-space:nowrap;min-width:100%}
.et th,.et td{border:1px solid #c4c4c4;padding:2px 7px;text-align:left}
.et td.n,.et th.n{text-align:right}
.et thead th{position:sticky;top:0;background:#e3e3ee;z-index:2;cursor:pointer;user-select:none;font-family:Arial,"Malgun Gothic",sans-serif}
.et thead tr.efr th{top:23px;background:#f1f1f7;padding:2px 3px;cursor:default}
.et thead th .so{color:var(--num);font-size:10px;margin-left:3px}
.ef{font:inherit;font-size:11.5px;width:100%;min-width:38px;border:1px solid var(--shade);padding:0 3px;height:19px;background:#fff;color:#000;text-transform:uppercase;border-radius:0}
.ef.on{background:#fff3a6}
.et tbody tr{cursor:pointer}
.et tbody tr:hover td{background:#eef3ff}
.et tbody tr.pk td{background:#ffd9d9}
.et tbody tr.sel td{outline:1px solid #000;outline-offset:-1px}
.et .more td{color:var(--fg2);font-family:Arial,"Malgun Gothic",sans-serif;cursor:default;background:#fafafa}
.pvc{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:7px 10px;font-size:12px;border-bottom:1px solid var(--edge);background:var(--chrome)}
.pvc select{font:inherit;font-size:12px;height:22px;border:1px solid var(--edge);background:#fff;color:#000;border-radius:0}
.pvc .hint{color:var(--fg2)}
.et.pv td{text-align:right;cursor:pointer}
.et.pv td.z{color:#bbb;cursor:default}
.et.pv th.rh{position:sticky;left:0;background:#e3e3ee;z-index:1;cursor:pointer}
.et.pv thead th{cursor:pointer}
.et.pv .tot{font-weight:700;background:#f1f1f7}
.et.pv td:hover:not(.z){background:#ffd9d9}
.cnrow{display:none}
#saveBtn{background:#fff0f0;color:#b00000;border-color:#b00000;margin-right:6px}
.ei{font:inherit;font-family:Consolas,monospace;font-size:12.5px;width:100%;min-width:60px;border:1px solid var(--shade);background:#fff;color:#000;padding:1px 4px;border-radius:0;text-transform:uppercase}
.ei:focus{outline:2px solid var(--num);outline-offset:0}
dd.chg .ei,dd.chg{background:#fff3a6}
#eMsg{font-size:11.5px;margin-top:6px;flex-basis:100%}
#eMsg .er{color:var(--warn);font-weight:700}
#eMsg button{font:inherit;font-size:11.5px;border:1px solid var(--edge);background:var(--win);padding:1px 8px;cursor:pointer;margin-top:4px}
.c.ed::after{content:"\270E";position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:9px;line-height:1;color:var(--ck)}
#sheet .edt{display:none}
@media (min-width:900px){
  #sheet{left:auto;top:0;bottom:0;right:0;width:318px;padding:0;border-top:0;border-left:2px solid var(--title);overflow:auto;box-shadow:-3px 0 0 rgba(0,0,0,.25)}
  #sheet .edt{display:flex;align-items:baseline;gap:8px;background:var(--title);color:var(--title-fg);font-weight:700;padding:5px 10px;position:sticky;top:0;z-index:1}
  #sheet .edt small{font-weight:400;opacity:.85;font-size:11px}
  #sheet .in{display:block;max-width:none;padding:8px 10px 14px}
  #sheet .cn{display:none}
  #sheet .cnrow{display:contents}
  #sheet dd:has(.ei){padding:0;border:0;background:none}
  #sheet dl{display:grid;grid-template-columns:118px 1fr;gap:2px 6px;align-items:center;margin:0}
  #sheet dl div{display:contents}
  #sheet .emp{display:contents}
  #sheet dt{font-size:12px;color:var(--fg);text-align:right;white-space:nowrap}
  #sheet dt::after{content:":"}
  #sheet dd{background:var(--win);border:1px solid var(--shade);min-height:21px;padding:2px 5px;font-weight:400;font-size:12.5px;font-family:Consolas,monospace;line-height:1.25;word-break:break-all}
  #sheet .emp dd{background:#f1f1f1}
  #sheet .x{display:block;margin:10px 0 0 auto}
  #bw:not(.free){padding-right:330px}
  body:has(#sheet:not([hidden])) .wrap{margin-right:322px}
}
@media (max-width:480px){ .c{height:var(--ch,31px)} .c .w{font-size:10px} .c .p{font-size:7.5px} .bays{padding:8px 6px 10px} }

/* ===== 겉모습: 윈도우 비스타(Aero) 느낌 — 유리 제목줄, 둥근 모서리, 부드러운 그림자, 광택 버튼 =====
   플랜 칸(색·테두리·글자)은 그대로 두고 창·버튼·입력칸만 바꿈. 이 묶음을 지우면 예전(클래식) 모습으로 돌아감 */
:root{
  --desk:#cfdff2; --chrome:#eef3fa; --edge:#8fa3c2; --shade:#aab6c8; --fg:#1b2433; --fg2:#4a586c;
  --num:#0b4fc4; --title:#3d72c0; --title-fg:#ffffff; --cell:#1b2433;
  --sans:"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;
  --glass:linear-gradient(to bottom,rgba(255,255,255,.62) 0,rgba(255,255,255,.22) 47%,rgba(255,255,255,0) 50%,rgba(255,255,255,.16) 100%),linear-gradient(to right,#2f5fa8,#5e97dc 45%,#4f88d0 70%,#2f5fa8);
  --btn:linear-gradient(to bottom,#fbfdff 0,#eaf0f8 48%,#d9e3f1 52%,#edf2f9 100%);
  --btn-h:linear-gradient(to bottom,#f2fbff 0,#d8f0fd 48%,#b9e3fb 52%,#d6effd 100%);
}
body{background:linear-gradient(165deg,#e6eff9 0,#cfdff2 45%,#b7cde8 100%) fixed;font-size:13px}
.win{border:1px solid #5d7fae;border-radius:8px;box-shadow:0 0 0 1px rgba(255,255,255,.55) inset,0 8px 22px rgba(25,55,100,.28)}
.win>.tb{background:var(--glass);border-radius:7px 7px 0 0;padding:6px 10px;text-shadow:0 1px 2px rgba(0,20,60,.65);border-bottom:1px solid #2c4f8a;align-items:center;letter-spacing:.01em}
.win>.body:last-child,.win>.gpw,#edBody,#edBody .edw:last-child,.bwf{border-radius:0 0 7px 7px}
header.win .body{background:linear-gradient(#f7faff,#e7eef8)}
#logo{border-radius:6px;border-color:#9fb2cc;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.note{border-radius:6px;border-color:#d8c36a;background:linear-gradient(#fffbe0,#fff3b8);box-shadow:0 2px 6px rgba(25,55,100,.15)}
/* 버튼 */
.btn,.x,.tb button,.bwin .tb button,.etab button,.bwf button,#eMsg button{
  background:var(--btn);border:1px solid #707f96;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.75);color:#1b2433;text-shadow:none;transition:background .12s,border-color .12s}
.btn:hover,.x:hover,.tb button:hover,.bwin .tb button:hover,.etab button:hover,.bwf button:hover,#eMsg button:hover{background:var(--btn-h);border-color:#3c7fb1}
.btn:active,.x:active,.tb button:active{background:linear-gradient(#c4e5f6,#98d1ef);box-shadow:inset 0 1px 3px rgba(0,40,80,.35)}
.btn{padding:6px 14px}
.tb button{height:23px}
#edBtn[aria-pressed="true"]{background:linear-gradient(#c4e5f6,#98d1ef);color:#0b2a55;border-color:#2c628b;box-shadow:inset 0 1px 3px rgba(0,40,80,.35)}
#saveBtn,#bwM{background:linear-gradient(#fff5f4,#ffd9d6 50%,#ffc6c1 52%,#ffe1de);color:#a40000;border-color:#b3413a}
#bwC{background:linear-gradient(#f4f9ff,#d6e8ff 50%,#c2dcff 52%,#deecff);color:#0b3f94;border-color:#3d72c0}
#bwM:hover,#saveBtn:hover{background:linear-gradient(#fff,#ffcbc6);border-color:#8c1d16}
#bwX{background:linear-gradient(#f0b3ad 0,#d9615a 48%,#c13229 52%,#dc6a62 100%);color:#fff;border-color:#7a1c16;font-weight:700;min-width:38px;text-shadow:0 1px 1px rgba(0,0,0,.5)}
#bwX:hover{background:linear-gradient(#ffc9c4 0,#f07068 48%,#d8382e 52%,#f4837b 100%);border-color:#5e120d}
.chips #sortCol{background:linear-gradient(90deg,#ff4136 0 25%,#19c2b0 25% 50%,#ff85e0 50% 75%,#ff9f1a 75%) bottom/100% 4px no-repeat,var(--btn);border-radius:3px}
/* 입력칸 */
#ship,#q,.tb select,.pvc select,.ef,.ei{border:1px solid #9aa7ba;border-radius:3px;box-shadow:inset 0 1px 2px rgba(0,0,0,.08);background:#fff}
#ship:hover,#q:hover,.tb select:hover,.pvc select:hover{border-color:#3c7fb1}
.tb select{height:23px;color:#1b2433;text-shadow:none;font-weight:600}
/* 포트 칩 */
.chip{border-radius:4px;border-color:#8fa3c2;overflow:hidden;box-shadow:0 1px 2px rgba(25,55,100,.15)}
.chip.on{box-shadow:0 0 0 2px var(--num)}
.swc{border-right-color:#8fa3c2}
/* 플랜 칸은 또렷하게 (어두운 테두리 유지) */
.c,.m,.lg{border-color:var(--cell)}
.hbar,.mbar{background:var(--cell)}
.gh{border-left-color:#d5dde9}
.mini.cur span{background:var(--title);border-radius:3px}
/* Bay Plan 창 */
#bw{background:rgba(20,45,85,.22)}
.bwin{border-radius:8px;box-shadow:0 0 0 1px rgba(255,255,255,.55) inset,0 16px 48px rgba(0,20,60,.5)}
.bwf{background:linear-gradient(#f7faff,#e7eef8);border-top-color:#b9c7dc}
/* Container Editor 패널 */
#sheet{background:linear-gradient(#f4f8fd,#e3ebf6);border-color:#5d7fae}
#sheet .edt{background:var(--glass);text-shadow:0 1px 2px rgba(0,20,60,.65);padding:7px 10px}
@media (min-width:900px){#sheet{box-shadow:-6px 0 18px rgba(25,55,100,.3);border-left:1px solid #5d7fae}
  #sheet dd{border-color:#9aa7ba;border-radius:3px} #sheet .emp dd{background:#eef2f7}}
/* Editor / Pivot */
.etab button{border-radius:4px 4px 0 0;opacity:.85;height:23px}
.etab button.on{background:#fff;box-shadow:inset 0 -3px 0 #3d72c0;opacity:1}
.et thead th,.et.pv th.rh{background:linear-gradient(#f9fbfe,#e2eaf5)}
.et thead tr.efr th{background:#f1f5fb}
.et th,.et td{border-color:#c9d3e2}
.et.pv .tot{background:#edf2f9}
.pvc{background:linear-gradient(#f7faff,#e7eef8);border-bottom-color:#b9c7dc}
.rzc,.wr.se{opacity:.7}
/* General Plan 옆 표: 포트별(세로) 수량 + BSA(14 HOMO) 대비. 이미지로 저장할 때도 같이 들어감 */
.gpx{display:flex;align-items:flex-start;min-width:0;background:var(--win)}
.gpx .gpw{flex:1 1 0;min-width:0}
.gi{flex:none;width:214px;padding:8px 8px 10px;font-size:11.5px;line-height:1.35;border-right:1px solid #c9d3e2;background:var(--win);color:var(--fg)}
.gi:empty,#gpInfo{display:none}   /* 화면에는 안 보이고, 이미지로 저장할 때만 들어감 */
.gix{display:flex;gap:10px;align-items:flex-start}
.pb{flex:none;width:58px;border:1px solid #000}
.pb em{display:block;text-align:center;font-style:normal;font-weight:700;font-size:11px;padding:2px 0;background:#e4ebf6}
.pb div{height:30px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;border-top:1px solid #000}
.gb{flex:1;min-width:0}.gb h4:first-child{margin-top:0}
.gi tr.bs td{font-weight:700;font-size:13px;text-align:center}
.gi .gt{font-size:15px;font-weight:700}
.gi .gn{color:var(--fg2);margin-bottom:6px}
.gi h4{margin:9px 0 3px;font-size:11.5px;padding:2px 4px;background:#e4ebf6;border:1px solid #c9d3e2}
.gi h4 small{font-weight:400;float:right}
.gi table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.gi th{font-weight:400;color:var(--fg2);text-align:right;padding:1px 3px;border-bottom:1px solid #c9d3e2}
.gi td{text-align:right;padding:2px 3px;border-bottom:1px solid #e6ebf3;white-space:nowrap}
.gi th:first-child,.gi td:first-child{text-align:left}
.gi tr.tt td{font-weight:700;border-top:1px solid #8fa3c0;border-bottom:0}

<script>
/*__ASC_DATA__*/
(function(){

var $=function(id){return document.getElementById(id)};
var st={plan:null,name:"",example:false,color:"podpol",filter:null,q:"",sel:-1,open:null,ship:"",shipBad:false,pick:[],lines:null,orig:null,eol:"\r\n",plan0:null,saved:""};   // lines·orig: 편집용 원본 줄(바이트 그대로), plan0: 고치기 전 값
var SHIPS=window.ASC_SHIPS||null;
var LAYOUT="row";try{if(localStorage.getItem("ascGpLayout")==="wrap")LAYOUT="wrap"}catch(_){}
var BP={},ORD=[],FIRSTHIT="",PANELS={},BOXP={};   // PANELS·BOXP: 긴급양하 메일 그림용 (베이 그림 재료, 컨테이너가 있는 베이)   // Bay Plan 창에 넣을 그림(베이별), 베이 순서, 검색에 걸린 첫 베이
// 양하항 색 (색정렬): 양하항이 N개면 이 목록의 앞 N색을 기항 순서대로. 앞 N색이 곧 'N개일 때 가장 잘 구분되는 묶음'
// (tools/pick_colors.py: CIEDE2000 + 적록 색약 시뮬레이션 + 선적항 흑백 띠와의 거리로 계산, 2·3개는 가장 익숙한 노랑·파랑·빨강)
// 노랑 파랑 빨강 청록 분홍 주황 초록 보라 연두 하늘 갈색 살구
var PAL=["#ffeb00","#1b2a8c","#ff4136","#19c2b0","#ff85e0","#ff9f1a","#2ecc40","#a66bff","#c3f53c","#5fd8ff","#b98555","#ffd0b0"];
// 고정 색 (준재님 지정): 북항 PUS = 파랑, 신항 PNC = 노랑 — 선적항(POL)일 때도 양하항(POD)일 때도 같은 색. 그 밖의 선적항은 회색.
// 파랑·노랑은 선적항 전용이라 양하항 색에서는 뺌 → 양하항은 빨강 청록 분홍 주황 초록 보라 연두 하늘 갈색 살구 순서
var POLFIX={PUS:"#1b2a8c",PNC:"#ffeb00"},POLGR=["#8c8c8c","#d9d9d9","#4d4d4d","#b3b3b3"];
var CUSTOM={};try{CUSTOM=JSON.parse(localStorage.getItem("ascPortColors")||"{}")||{}}catch(_){CUSTOM={}}
function saveColors(){try{localStorage.setItem("ascPortColors",JSON.stringify(CUSTOM))}catch(_){}}
function ink(hex){var r=parseInt(hex.substr(1,2),16),g=parseInt(hex.substr(3,2),16),b=parseInt(hex.substr(5,2),16);
  return (r*299+g*587+b*114)/1000>140?"#000":"#fff"}

function parseAsc(text){
  var lines=text.split(/\r?\n/), head=lines[0]||"", f604=head.indexOf("$604")===0;
  var hp=head.slice(4).split("/").map(function(s){return s.trim()});
  var out={voy:hp[2]||"",vsl:hp[1]||"",rotation:[],boxes:[],dg:{}}, inDg=false;
  for(var i=1;i<lines.length;i++){
    var l=lines[i];
    if(/^\$60\dPORT ROTATION\//.test(l)){var s=l.split("/")[1].trim();for(var k=0;k+3<=s.length;k+=3)out.rotation.push(s.slice(k,k+3));continue}
    if(l.indexOf("***")===0){inDg=/IMDG/i.test(l);continue}
    if(inDg){
      if(/^\d{6}/.test(l)){var no=l.slice(0,4),c=l.slice(6,8).trim(),un=l.slice(8,12).trim(),pg=l.slice(23,24).trim();
        if(c.length===2)c=c[0]+"."+c[1];
        (out.dg[no]=out.dg[no]||[]).push({cls:c,un:un,pg:pg})}
      continue}
    if(/^\d{6} /.test(l)&&+l.slice(0,2)>0&&l.slice(27,33).trim()){
      var t=l.slice(44,48).trim(), w=f604?l.slice(87,92):l.slice(80,85);
      var kg=/^\d+$/.test(w.trim())?+w:0; if(!kg)kg=(+l.slice(48,51).trim()||0)*100;
      var bay=+l.slice(0,2), tmp=l.slice(55,60).trim();
      // 타입 코드 두 가지: ISO(22GP·45GP·22TN) / CASP식(DC20·DCHC·TK20·RF2H·DC45)
      var iso=/^[0-9L]/.test(t), tail=t.slice(2), size, len, hc, tk;
      if(iso){size=t[0]==="2"?20:40;len=t[0]==="L"?45:size;hc=/^.[56]/.test(t)||t[0]==="L";tk=t[2]==="T"}
      else if(t){size=(tail==="20"||tail==="2H")?20:(tail==="40"||tail==="HC"||tail==="45"||tail==="4H")?40:(bay%2?20:40);
        len=tail==="45"?45:size;hc=tail==="HC"||tail==="2H"||tail==="4H"||tail==="45";tk=t.slice(0,2)==="TK"}
      else{size=bay%2?20:40;len=size;hc=false;tk=false}
      out.boxes.push({bay:bay,row:+l.slice(2,4),tier:+l.slice(4,6),cntr:l.slice(7,18).trim(),line:l.slice(19,27).trim(),
        pol:l.slice(27,30).trim(),pod:l.slice(30,33).trim(),dest:l.slice(39,44).trim(),type:t,size:size,len:len,
        lab:l.slice(53,55).trim(),ov:[92,101,104,95,98].map(function(c){return +l.slice(c,c+3).trim()||0}),   // H,P,S,F,A
        pol5:/^[A-Z]{5}$/.test(l.slice(188,193))?l.slice(188,193):"",pod5:/^[A-Z]{5}$/.test(l.slice(193,198))?l.slice(193,198):"",
        hc:hc,tk:tk,rt:iso?t[2]==="R":t.slice(0,2)==="RF",fe:l.slice(51,52)==="E"?"E":"F",kg:kg,
        rf:/C$/.test(tmp),temp:tmp,dgno:l.slice(60,64).trim(),li:i});
    }
  }
  return out;
}

// ---------- EDI (BAPLIE 1.5 / 2.2) 읽기: ASC 와 같은 모양의 플랜으로 바꿈. 보기 전용(편집·저장은 ASC 만) ----------
// 컨테이너 한 개 = LOC+147(자리 BBBRRTT) 부터 다음 LOC+147 전까지. LOC+6/9 = 선적항, LOC+12/11 = 양하항, EQD = 번호·타입·F/E(5/4),
// NAD+CA = OPR, MEA = 무게(kg), TMP = 냉동 온도, DGS = 위험물(등급·UN). 기항 순서(Port Rotation)는 EDI 에 없음.
function isEdi(t){return /^\s*UN[AB]/.test(t)&&/BAPLIE/.test(t.slice(0,400))}
function parseEdi(text){
  var segs=text.replace(/[\r\n]/g,"").split("'"),out={voy:"",vsl:"",rotation:[],boxes:[],dg:{},edi:true,ediVer:/SMDG1/.test(text.slice(0,400))?15:22,hdr:{}},b=null,nd=0,R={},k;
  for(k in (window.ASC_PORTS||{}))if(!R[window.ASC_PORTS[k]])R[window.ASC_PORTS[k]]=k;   // 5글자 -> 회사에서 쓰는 3글자
  function p3(c){return R[c]||(c.length===5?c.slice(2):c)}
  function done(){if(!b)return;
    var t=b.type||"",c0=t[0],c2=t[2];
    b.size=!t?(b.bay%2?20:40):c0==="2"?20:40; b.len=(c0==="L"||c0==="9")?45:b.size;
    b.hc=/^.[56]/.test(t)||c0==="L"||c0==="9"; b.tk=c2==="T"||c2==="7"; b.rt=c2==="R"||c2==="3"||c2==="4";
    out.boxes.push(b);b=null}
  segs.forEach(function(sg){
    var e=sg.split("+"),tag=e[0],q=e[1]||"",c=(e[2]||"").split(":");
    if(tag==="UNB"){out.hdr.snd=e[2]||"";out.hdr.rcv=e[3]||""}
    else if(tag==="LOC"&&q==="5"){out.hdr.dep=c[0]}
    if(tag==="TDT"){e.forEach(function(x){var m1=/^([^:]*):172/.exec(x),m2=/^([^:]*):103/.exec(x);if(m1)out.hdr.car=m1[1];if(m2)out.hdr.cs=m2[1]});
      out.voy=e[2]||"";e.forEach(function(x){var m=/:(?:103|146|ZZZ)?:[^:]*:?([^:]+)$/.exec(x);if(/:103:|:146:/.test(x)&&m)out.vsl=m[1].trim()})}
    else if(tag==="LOC"&&q==="147"){done();var p=c[0].replace(/\D/g,"");if(p.length<7)p=("0000000"+p).slice(-7);
      b={bay:+p.slice(0,p.length-4),row:+p.slice(-4,-2),tier:+p.slice(-2),cntr:"",line:"",pol:"",pod:"",dest:"",type:"",lab:"",ov:[0,0,0,0,0],
        pol5:"",pod5:"",fe:"F",kg:0,rf:false,temp:"",dgno:"",li:-1}}
    else if(!b)return;
    else if(tag==="LOC"){var pc=c[0].trim().toUpperCase();
      if(q==="6"||q==="9"){b.pol5=pc;b.pol=p3(pc)}
      else if(q==="12"||q==="11"){b.pod5=pc;b.pod=p3(pc)}

  var mxE=0,mxO=0,zero=false;rs.forEach(function(r){if(r===0)zero=true;else if(r%2)mxO=Math.max(mxO,r);else mxE=Math.max(mxE,r)});

}

// ---------- 편집: 원본 줄에서 그 칸만 바꾸고 다시 읽음. 다른 칸·다른 줄은 한 글자도 안 건드림 ----------
function evOf(b,k){   // 편집칸에 보이는 값
  if(k==="pol")return b.pol5||port5(b.pol); if(k==="pod")return b.pod5||port5(b.pod);
  if(k==="kg")return String(b.kg||0);
  if(k==="temp"){var m=/^(-?\d+)C$/.exec(b.temp||"");return b.rf?(m?(+m[1]/10).toFixed(1):b.temp):""}   // ASC 온도는 소수점 없이 적힘 (-250C = -25.0)
  if(k==="line")return b.line||""; if(k==="dest")return b.dest||""; if(k==="type")return b.type||"";
  return b[k]==null?"":String(b[k]);
}
function putCol(l,a,z,v,right){
  if(l.length<198)l+=new Array(199-l.length).join(" ");
  v=String(v).slice(0,z-a);var sp=new Array(z-a-v.length+1).join(" ");
  return l.slice(0,a)+(right?sp+v:v+sp)+l.slice(z);
}

  else if(k==="line"){if(!/^[A-Z0-9]{0,8}$/.test(v))return "OPR은 영문·숫자 8자 이내로 넣어 주세요.";l=putCol(l,19,27,v)}
  else if(k==="pol"||k==="pod"){
    if(!/^([A-Z]{3}|[A-Z]{5})$/.test(v))return "포트는 3글자(PUS)나 5글자(KRPUS)로 넣어 주세요.";
    var p3=v.length===5?v.slice(2):v, p5=v.length===5?v:port5(v); if(p5.length!==5)p5="";
    if(k==="pol"){l=putCol(l,27,30,p3);l=putCol(l,188,193,p5)}else{l=putCol(l,30,33,p3);l=putCol(l,193,198,p5)}}
  else if(k==="dest"){if(!/^([A-Z]{5})?$/.test(v))return "DEST는 5글자(KRPUS)로 넣거나 비워 주세요.";l=putCol(l,39,44,v)}
  else if(k==="type"){if(!/^[A-Z0-9]{4}$/.test(v))return "SzTp는 4자(예: 22GP, 45GP)로 넣어 주세요.";l=putCol(l,44,48,v)}
  else if(k==="kg"){v=v.replace(/,/g,"");if(!/^\d{1,5}$/.test(v))return "Weight는 kg 숫자(0~99999)로 넣어 주세요.";
    var kg=+v,w3=Math.min(999,Math.round(kg/100)),ka=f604?87:80,had=l.slice(ka,ka+5).trim()!=="";
    l=putCol(l,48,51,("00"+w3).slice(-3));
    if(had||kg%100)l=putCol(l,ka,ka+5,("0000"+kg).slice(-5))}   // 상세 kg 칸은 원래 적혀 있었거나 100kg 단위가 아닐 때만 씀
  else if(k==="fe"){if(v!=="F"&&v!=="E")return "F/E는 F 또는 E로 넣어 주세요.";l=putCol(l,51,52,v)}

      var n=Math.round(parseFloat(v)*10),t=f604?String(n)+"C":(n<0?"-":"")+("0"+Math.abs(n)).slice(-Math.max(2,String(Math.abs(n)).length))+"C";
      l=putCol(l,55,60,t,f604)}}   // $609(cCASP)는 왼쪽 맞춤 "250C ", $604(CASP)는 오른쪽 맞춤 " 250C"

// ---------- 되돌리기(Alt+3)·컨테이너 삭제 ----------
// 플랜을 바꾸는 동작(값 고치기, 삭제)은 하기 직전에 pushUndo() 로 지금 상태를 쌓아 둔다. 새 변경 기능을 넣을 때도 같은 방식으로.
// ASC: 줄 배열(st.lines)을 통째로 보관. 지운 컨테이너는 그 줄을 빈 줄("")로 바꿔 둠 — 줄 번호가 안 밀려서 원래 값과 계속 짝이 맞음. 내보낼 때 ascOut() 이 빼 줌.

function pushUndo(){if(!st.undo)st.undo=[];st.undo.push(st.lines?{lines:st.lines.slice()}:{boxes:st.plan.boxes.slice(),mod:!!st.mod});if(st.undo.length>60)st.undo.shift()}

  st.pick=[];st.sel=-1;st.saved="";$("sheet").hidden=true;render();say("한 단계 되돌렸어요."+(st.undo.length?" (더 되돌릴 수 있는 단계 "+st.undo.length+"개)":""))}

  else{st.plan.boxes=B.filter(function(b){return ids.indexOf(b.i)<0});st.mod=true}
  st.pick=[];st.sel=-1;st.saved="";$("sheet").hidden=true;render();
  say("컨테이너 "+bx.length+"개를 지웠어요 ("+bx.slice(0,6).map(function(b){return b.cntr}).join(", ")+(bx.length>6?" …":"")+"). Alt + 3 으로 되돌릴 수 있어요.")}

function ascOut(){   // 내보낼 ASC 글: 지운 컨테이너 줄을 빼고, 머리말의 RECORD 수와 안 쓰는 위험물 줄을 맞춤
  var keep=st.lines.filter(function(l,i){return !(l===""&&st.orig[i]!=="")});
  if(keep.length===st.lines.length)return st.lines.join(st.eol);
  var used={},n=0,inDg=false;st.plan.boxes.forEach(function(b){n++;if(b.dgno)used[b.dgno]=1});
  keep=keep.filter(function(l){if(l.indexOf("***")===0){inDg=/IMDG/i.test(l);return true}return !(inDg&&/^\d{6}/.test(l)&&!used[l.slice(0,4)])});
  keep[0]=keep[0].replace(/RECORD=\s*\d+\s*/,function(m){return fx("RECORD="+n,m.length)});
  return keep.join(st.eol)}

// ---------- EXPORT PLAN: 지금 플랜을 ASC / EDI(BAPLIE 2.2·1.5) 로 내보냄 ----------
// 항상 '지금 상태'에서 만든다 — ASC 로 연 플랜은 st.lines(고친 줄 포함), 나머지는 st.plan.boxes.
// 그래서 나중에 플랜을 바꾸는 기능을 더 넣어도, st.lines(ASC) 와 st.plan 만 맞게 고쳐 두면 내보내기에 그대로 반영된다.
// 같은 형식으로 내보내면 원본 바이트 그대로(고친 칸만 다름), 다른 형식이면 컨테이너 정보로 새로 만든다.
function fx(v,n,right){v=String(v==null?"":v);if(v.length>n)v=v.slice(0,n);while(v.length<n)v=right?" "+v:v+" ";return v}
function genAsc(){
  var P=st.plan,B=P.boxes,L=[],sh=curShip(),rot=(P.rotation||[]).slice(),dgs=[],dn=0;
  if(!rot.length){var pw={};B.forEach(function(b){pw[b.pol]=(pw[b.pol]||0)+1});
    rot=Object.keys(pw).sort(function(a,b){return pw[b]-pw[a]});B.forEach(function(b){if(b.pod&&rot.indexOf(b.pod)<0)rot.push(b.pod)})}
  L.push(fx("$609    /"+fx(P.vsl||(sh&&sh.n)||"",20)+"/"+fx(P.voy||"",12)+"/"+fx("PLANVIEWER",12)+"/POD:   /        /RECORD="+fx(B.length,4)+"/            /",198));
  L.push(fx("$609PORT ROTATION/"+rot.map(function(x){return fx(x,3)}).join(""),198));
  B.forEach(function(b,i){
    var no="";if(b.dgno&&(P.dg[b.dgno]||[]).length){no=("000"+(++dn)).slice(-4);
      P.dg[b.dgno].forEach(function(d,j){var c=String(d.cls||"").replace(".","");dgs.push(fx(no+("0"+j).slice(-2)+fx(c,2)+fx(d.un,4)+"0",23)+fx(d.pg||"",1))})}
    var ov=b.ov||[0,0,0,0,0],t=b.rf&&b.temp?b.temp:"";
    L.push(pad(b.bay)+pad(b.row)+pad(b.tier)+" "+fx(b.cntr,11)+" "+fx(b.line,8)+fx(b.pol,3)+fx(b.pod,3)+fx("",6)+fx(b.dest,5)+fx(b.type,4)+
      fx(Math.floor(b.kg/100),3)+(b.fe==="E"?"E":"F")+" "+fx(b.lab,2)+fx(t,5)+fx(no,4)+fx("",16)+("0000"+Math.round(b.kg)).slice(-5)+fx("",7)+
      [ov[0],ov[3],ov[4],ov[1],ov[2]].map(function(v){return fx(v||0,3)}).join("")+fx("",70)+("0000"+(i+1)).slice(-5)+fx("",6)+
      fx(b.pol5||port5(b.pol),5)+fx(b.pod5||port5(b.pod),5))});
  L.push(fx("***Refer to the following remark.",198),fx("***Refer to the following IMDG.",198));
  dgs.forEach(function(d){L.push(fx(d,198))});
  L.push(fx("***Refer to the following VGM remark.",198),"");
  return L.join("\r\n");
}
function genEdi(ver){
  var P=st.plan,B=P.boxes,H=P.hdr||{},sh=curShip(),d=new Date(),p2=function(n){return ("0"+n).slice(-2)};
  var ymd=d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate()),hm=p2(d.getHours())+p2(d.getMinutes());
  var vn=(P.vsl||(sh&&sh.n)||"").trim(),cs=H.cs||"",car=H.car||"",snd=H.snd||"PLAN VIEWER",rcv=H.rcv||"CASP",dep=H.dep,pw={};
  if(!dep){B.forEach(function(b){var k=b.pol5||port5(b.pol);pw[k]=(pw[k]||0)+1});dep=Object.keys(pw).sort(function(a,b){return pw[b]-pw[a]})[0]||""}
  var S=ver===15?["UNB+UNOA:1+"+snd+"+"+rcv+"+"+ymd.slice(2)+":"+hm+"+0+++++"+car,"UNH+1+BAPLIE:1:911:UN:SMDG15","BGM++0+9","DTM+137:"+ymd.slice(2)+hm+":201",
      "TDT+20+"+(P.voy||"")+"++"+cs+":103::"+vn+"++"+car+":172:20","LOC+5+"+dep,"DTM+178:"+ymd+hm+":203"]
    :["UNB+UNOA:2+"+snd+"+"+rcv+"+"+ymd+":"+hm+"+0","UNH+1+BAPLIE:D:95B:UN:SMDG22","BGM++0+9","DTM+137:"+ymd+hm+":203",
      "TDT+20+"+(P.voy||"")+"+++"+car+":172:20+++"+cs+":103::"+vn,"LOC+5+"+dep+":139:6","DTM+178:"+ymd+hm+":203"];
  B.forEach(function(b){
    S.push("LOC+147+"+("00"+b.bay).slice(-3)+pad(b.row)+pad(b.tier)+"::5","MEA+"+(ver===15?"WT":"VGM")+"++KGM:"+("0000"+Math.round(b.kg)).slice(-5));
    var m=/^(-?\d+)C$/.exec(b.temp||"");if(b.rf&&m)S.push("TMP+2+"+(+m[1]/10).toFixed(1)+":CEL");
    S.push("LOC+"+(ver===15?"6":"9")+"+"+(b.pol5||port5(b.pol)),"LOC+"+(ver===15?"12":"11")+"+"+(b.pod5||port5(b.pod)));
    if(/^[A-Z]{5}$/.test(b.dest||""))S.push("LOC+83+"+b.dest);
    var id=(b.cntr||"").replace(/\s+/g,"");if(ver===15&&id.length>4)id=id.slice(0,4)+" "+id.slice(4);
    S.push("RFF+BM:1","EQD+CN+"+id+"+"+(b.type||"")+(ver===15?"+++":"++0+")+(b.fe==="E"?"4":"5"),"NAD+CA+"+(b.line||"")+":172:20");
    var ov=b.ov||[];[[9,0,":::"],[8,1,"::"],[7,2,"::"],[5,3,":"],[6,4,":"]].forEach(function(o){if(ov[o[1]]>0)S.push("DIM+"+o[0]+"+CMT"+o[2]+ov[o[1]])});
    (b.dgno&&P.dg[b.dgno]||[]).forEach(function(g){S.push("DGS+IMD+"+g.cls+"+"+g.un+(g.pg?"++"+g.pg:""))})});
  S.push("UNT+"+S.length+"+1","UNZ+1+0");   // UNT 개수 = UNH 부터 UNT 까지 (UNB 빼고 UNT 넣어서 같은 수)

function exportPlan(kind){

function latin1(u){var s="",i=0;for(;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return s}
function loadBytes(u,name){   // 바이트를 1:1 글자로 읽어야 저장할 때 원본과 한 바이트도 안 달라짐

  $("v3H").onclick=function(){V3.hold=!V3.hold;this.setAttribute("aria-pressed",V3.hold);v3Draw()};
  // 양옆 화살표: 한 번 누르면 15도, 누르고 있으면 계속 돌아감
  function spin(btn,dir){var t=0;function stop(){clearInterval(t);t=0}
    btn.addEventListener("pointerdown",function(e){e.preventDefault();V3.yaw+=dir*0.26;v3Draw();clearInterval(t);var n=0;t=setInterval(function(){if(++n<5)return;V3.yaw+=dir*0.05;v3Draw()},50)});
    ["pointerup","pointerleave","pointercancel"].forEach(function(ev){btn.addEventListener(ev,stop)});
    btn.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();V3.yaw+=dir*0.26;v3Draw()}})}
  spin($("v3L"),1);spin($("v3Rt"),-1);
  document.addEventListener("click",function(e){if(e.target.id==="v3Btn")v3Open()});
  window.addEventListener("resize",function(){v3Draw()});
})();
// ---------- 단축키 표: 여기 한 줄을 넣으면 단축키가 생기고 도움말(F1)에도 자동으로 나옴 ----------
// keys = 도움말에 보이는 글, d = 설명. 키보드 단축키는 code(자판 위치)·alt/ctrl/shift·fn(할 일)·plan(플랜이 열려 있을 때만)을 같이 적음.
// code 가 없는 줄은 마우스 동작처럼 다른 곳에서 처리하는 것 — 도움말에만 나옴.
var KEYS=[
  {keys:["F1"],d:"도움말 열기 · 닫기",code:"F1",fn:function(){helpBox()}},
  {keys:["Alt","E"],d:"EDITOR / PIVOT 켜기 · 끄기",code:"KeyE",alt:1,plan:1,fn:function(){$("edBtn").click()}},
  {keys:["Ctrl","Tab"],d:"다음 플랜 탭으로 (마지막 탭 다음은 첫 탭)",code:"Tab",ctrl:1,fn:function(){tabStep(1)}},
  {keys:["Alt","F"],d:"컨테이너 찾기 열기 · 닫기",code:"KeyF",alt:1,plan:1,fn:function(){findBox()}},
  {keys:["Ctrl","클릭"],d:"컨테이너 여러 개 고르기 (Bay Plan 에서는 Container Editor 도 같이 떠요)"},
  {keys:["Ctrl","오른쪽 버튼 클릭"],d:"고른 컨테이너 선택 해제 (빨간 표식 지우기)"},
  {keys:["Ctrl","드래그"],d:"네모로 끌어서 그 안의 컨테이너를 한꺼번에 고르기"},
  {keys:["Ctrl","오른쪽 버튼 드래그"],d:"네모 안의 컨테이너 선택 해제"},
  {keys:["오른쪽 버튼 클릭"],d:"그 컨테이너 하나 삭제 (확인 창에서 Enter = 삭제, Esc = 취소)"},
  {keys:["오른쪽 버튼 드래그"],d:"네모 안의 컨테이너 여러 개 삭제"},
  {keys:["Alt","3"],d:"되돌리기 (삭제 · 고친 값을 한 단계씩)",code:"Digit3",code2:"Numpad3",alt:1,plan:1,fn:function(){undo()}},
  {keys:["Shift","클릭"],d:"Editor 목록에서 범위로 고르기 · 열 제목은 여러 열 정렬"},
  {keys:["Alt","휠"],d:"General Plan 확대 · 축소"},
  {keys:["더블클릭"],d:"베이를 Bay Plan 창으로 열기"},
  {keys:["←"],or:["→"],d:"Bay Plan 창에서 옆 베이로 넘기기"},
  {keys:["Enter"],d:"찾은 컨테이너의 베이 열기 · 고친 값 반영"},
  {keys:["Esc"],d:"열려 있는 창 닫기"}
];
function helpDraw(){
  function kb(a){return a.map(function(x){return /^(클릭|휠|더블클릭|드래그|오른쪽 버튼 드래그|오른쪽 버튼 클릭)$/.test(x)?x:"<kbd>"+esc(x)+"</kbd>"}).join(" + ")}
  $("helpT").innerHTML=KEYS.map(function(K){return "<tr><td>"+kb(K.keys)+(K.or?" "+kb(K.or):"")+"</td><td>"+esc(K.d)+"</td></tr>"}).join("")}
helpDraw();
document.addEventListener("keydown",function(e){
  if(window.__STATIC__)return;
  if(!$("ask").hidden){   // 삭제 확인 창이 떠 있는 동안은 Enter·Esc 만 받음
    if(e.key==="Enter"){e.preventDefault();e.stopPropagation();askEnd(true)}else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();askEnd(false)}
    else if(e.key!=="Tab")e.stopPropagation();
    return}
  if(e.key==="Alt"){e.preventDefault();return}   // Alt 만 눌렀다 떼면 브라우저 메뉴로 넘어가는 것을 막음
  for(var ki=0;ki<KEYS.length;ki++){var K=KEYS[ki];   // 단축키 표에서 찾아 실행 (한글 입력 상태에서도 되게 자판 위치 e.code 로 봄)
    if(K.code&&(K.code===e.code||K.code2===e.code)&&!!K.alt===e.altKey&&!!K.ctrl===(e.ctrlKey||e.metaKey)&&!!K.shift===e.shiftKey){
      e.preventDefault();if(K.plan&&!st.plan)return;K.fn();return}}
  if(e.key==="Escape"&&!$("expMenu").hidden){e.stopPropagation();expMenu(false);return}
  if(e.key==="Escape"&&!$("help").hidden){e.stopPropagation();helpBox(false)}
  else if(e.key==="Escape"&&!$("help").hidden){e.stopPropagation();helpBox(false)}
  else if(e.key==="Escape"&&!$("fbox").hidden&&document.activeElement===$("q")){e.stopPropagation();findBox(false)}
},true);
document.addEventListener("keyup",function(e){if(e.key==="Alt")e.preventDefault()},true);
function helpBox(on){var h=$("help");if(on==null)on=h.hidden;h.hidden=!on}
$("helpBtn").onclick=function(){helpBox()};$("hX").onclick=function(){helpBox(false)};
$("help").addEventListener("click",function(e){if(e.target.id==="help")helpBox(false)});
$("sX").onclick=function(){st.sel=-1;$("sheet").hidden=true;render()};
$("q").addEventListener("input",function(e){st.q=e.target.value.trim().toUpperCase();render()});

setZoom(zoom);
if(window.__ICON__){$("logo").src=window.__ICON__;$("logo").hidden=false}   // 이 PC 전용 그림 (실행 파일이 넣어 줌)
// PC 설치판: 이미 떠 있는 뷰어 창이 있으면, 다음에 더블클릭한 파일은 새 창 대신 이 창의 탭으로 들어옴.
// 실행 파일(open-asc.ps1)이 작은 파일(inbox.js)에 새 플랜을 적어 두고, 이 화면이 그 파일을 1초에 한 번쯤 읽어 봄.
if(window.__INBOX__&&!window.__STATIC__){
  var IN0=Date.now()-1500,INS={};
  window.__ASC_INBOX__=function(m){if(!m||INS[m.id]||m.t<IN0)return;INS[m.id]=1;
    try{var bn=atob(m.b64),uu=new Uint8Array(bn.length);for(var i2=0;i2<bn.length;i2++)uu[i2]=bn.charCodeAt(i2);loadBytes(uu,m.name||"plan.asc");window.focus()}catch(_){}};
  setInterval(function(){var sc=document.createElement("script");sc.src=window.__INBOX__+"?"+Date.now();sc.onload=sc.onerror=function(){sc.remove()};document.head.appendChild(sc)},800);
}
var E=window.__ASC__;
if(E&&E.b64){var bin=atob(E.b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  loadBytes(u,E.name||"plan.asc")}
if(!st.plan)document.body.classList.add("empty");   // 처음 화면은 비워 둠 (예시 플랜을 보여 주지 않음)
// ---------- 앱(설치판): 깃허브 페이지에서만 켜짐 (manifest 가 연결돼 있을 때) ----------
// 안드로이드 크롬: '앱 설치' 버튼 → 홈 화면 아이콘. 설치하면 아웃룩 등에서 .asc 를 '공유 → PLAN VIEWER'로 바로 열 수 있음.
if(!window.__STATIC__&&document.querySelector('link[rel="manifest"]')&&"serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(function(){});
  var dp=null;
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;$("instBtn").hidden=false});
  window.addEventListener("appinstalled",function(){dp=null;$("instBtn").hidden=true});
  $("instBtn").onclick=function(){if(!dp)return;dp.prompt();dp.userChoice.then(function(){dp=null;$("instBtn").hidden=true})};
  if(/[?&]shared=1/.test(location.search)&&window.caches){   // 다른 앱에서 공유로 넘어온 파일
    var su=new URL("shared-file",location.href.split("?")[0]).href;
    caches.open("asc-shared").then(function(c){return c.match(su).then(function(r){if(!r)return;
      var nm="plan.asc";try{nm=decodeURIComponent(r.headers.get("X-Name")||nm)}catch(_){}
      return r.arrayBuffer().then(function(b){loadBytes(new Uint8Array(b),nm);return c.delete(su)})})}).catch(function(){});
    try{history.replaceState(null,"",location.pathname)}catch(_){}
  }
  if(window.launchQueue)launchQueue.setConsumer(function(p){if(p.files&&p.files[0])p.files[0].getFile().then(readFile)});   // PC 설치판: .asc 연결 프로그램
}
if(window.__STATIC__){
  LAYOUT="wrap";zoom=100;st.open=null;render();
  document.body.classList.add("static");
  $("gpWin").querySelector(".tb small").textContent="선수가 오른쪽 · 아래에 베이별 Bay Plan이 이어져요";
  var sh2="";ORD.forEach(function(id){var d=BP[id];
    sh2+='<section class="win sbp" id="bp-'+id+'"><div class="tb">Bay Plan - '+d.name+' <small>'+d.sub+'</small><span class="sp"></span><a href="#gpWin">▲ 위로</a></div><div class="bwb">'+d.html+'</div></section>'});
  $("gpWin").insertAdjacentHTML("afterend",sh2);
  [].forEach.call(document.querySelectorAll(".mini"),function(b){var a=document.createElement("a");a.className=b.className;a.href="#bp-"+b.dataset.go;a.innerHTML=b.innerHTML;b.parentNode.replaceChild(a,b)});
  [].forEach.call(document.querySelectorAll("input.swc"),function(b){var a=document.createElement("i");a.className="swc";a.style.background=b.value;b.parentNode.replaceChild(a,b)});
  // 칸 누르기: 칸을 링크로, 컨테이너마다 상세 판을 미리 만들어 둠
  var sd="";st.plan.boxes.forEach(function(b){showBox(b.i);
    sd+='<div class="sd" id="d'+b.i+'"><div class="in"><div class="cn">'+esc($("sCn").textContent)+'</div><dl>'+$("sDl").innerHTML+'</dl><a class="x" href="#x0">닫기</a></div></div>'});
  $("sheet").hidden=true;st.sel=-1;
  document.body.insertAdjacentHTML("beforeend",sd);
  [].forEach.call(document.querySelectorAll("button.c.b"),function(b){var a=document.createElement("a");a.className=b.className.replace(" sel","");a.href="#d"+b.dataset.i;
    a.setAttribute("style",b.getAttribute("style")||"");a.setAttribute("aria-label",b.getAttribute("aria-label")||"");a.innerHTML=b.innerHTML;b.parentNode.replaceChild(a,b)});
  // 포트 고르기: 숨은 라디오 + label
  var fr='<input class="fr" type="radio" name="f" id="f-all" checked>',css="";
  [].forEach.call(document.querySelectorAll("button.chipb"),function(b){var f=b.dataset.f,pol=f[0]==="@",k=(pol?f.slice(1):f).replace(/\W/g,"_"),id="f-"+(pol?"l":"k")+k;
    fr+='<input class="fr" type="radio" name="f" id="'+id+'">';
    css+='#'+id+':checked~.wrap .b:not(.'+(pol?"l":"k")+k+'){opacity:.18}#'+id+':checked~.wrap label[for="'+id+'"]{box-shadow:0 0 0 2px var(--num)}';
    var a=document.createElement("label");a.className="chipb";a.htmlFor=id;a.innerHTML=b.innerHTML;b.parentNode.replaceChild(a,b)});
  document.querySelector(".chips").insertAdjacentHTML("beforeend",'<label class="chipb allb" for="f-all">전체 보기</label>');
  document.body.insertAdjacentHTML("afterbegin",fr+'<style>'+css+'</style>');
  var hn=document.querySelector("#sum .hint");if(hn)hn.textContent="포트 이름을 누르면 그 포트만 진하게 보이고, Bay Plan의 칸을 누르면 컨테이너 번호와 상세가 떠요.";
}
})();
